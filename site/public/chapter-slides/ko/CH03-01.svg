<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">전송·저장·학습은 서로 다른 질문</title>
<desc id="d">AI 서비스에 입력한 내용은 먼저 서비스 회사로 전송되고, 저장 여부와 학습 사용 여부는 그와 별개로 확인해야 하는 질문임을 보여 줍니다. 학습에 쓰이지 않거나 저장되지 않아도 전송은 일어난다는 점을 흔한 오해와 대비합니다.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b7fb5"/></marker>
</defs>
<text x="64" y="70" font-size="22" font-weight="700" fill="#2f5d9b">CH03 · 1/3</text>
<text x="64" y="128" font-size="46" font-weight="700" fill="#14253d">전송·저장·학습은 서로 다른 질문</text>
<text x="64" y="172" font-size="26" fill="#566273">AI 서비스에 입력한 내용에 대해 따로 확인할 세 가지</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- input -->
<rect x="64" y="300" width="240" height="125" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="184" y="352" font-size="30" font-weight="700" fill="#14253d" text-anchor="middle">내 입력</text>
<text x="184" y="394" font-size="26" fill="#566273" text-anchor="middle">글 · 파일</text>
<line x1="304" y1="362" x2="360" y2="362" stroke="#5b7fb5" stroke-width="4" marker-end="url(#ar)"/>

<!-- transmission -->
<rect x="364" y="225" width="440" height="275" rx="12" fill="#14253d"/>
<text x="584" y="286" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">① 전송되는가?</text>
<text x="584" y="346" font-size="26" fill="#ffffff" text-anchor="middle">내 입력이 서비스 회사에</text>
<text x="584" y="382" font-size="26" fill="#ffffff" text-anchor="middle">도착하는가</text>
<text x="584" y="440" font-size="24" fill="#e6eef9" text-anchor="middle">서버에서 동작하는 AI 서비스는</text>
<text x="584" y="474" font-size="24" fill="#e6eef9" text-anchor="middle">대체로 그렇다</text>

<!-- branches -->
<path d="M804 300 H834 V290 H860" fill="none" stroke="#5b7fb5" stroke-width="4" marker-end="url(#ar)"/>
<path d="M804 425 H834 V435 H860" fill="none" stroke="#5b7fb5" stroke-width="4" marker-end="url(#ar)"/>

<rect x="864" y="225" width="672" height="130" rx="12" fill="#e6eef9" stroke="#5b7fb5" stroke-width="2"/>
<text x="892" y="267" font-size="30" font-weight="700" fill="#14253d">② 저장되는가?</text>
<text x="892" y="305" font-size="26" fill="#1f2a37">대화 기록 등이 얼마 동안 남는가</text>
<text x="892" y="340" font-size="24" fill="#566273">서비스 · 계정 종류 · 설정마다 다르다</text>

<rect x="864" y="370" width="672" height="130" rx="12" fill="#e6eef9" stroke="#5b7fb5" stroke-width="2"/>
<text x="892" y="412" font-size="30" font-weight="700" fill="#14253d">③ 학습에 쓰이는가?</text>
<text x="892" y="450" font-size="26" fill="#1f2a37">회사가 모델 개선에 내 내용을 쓸 수 있는가</text>
<text x="892" y="485" font-size="24" fill="#566273">서비스 · 계정 종류 · 설정마다 다르다</text>

<!-- case strip -->
<rect x="64" y="520" width="1472" height="52" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="88" y="555" font-size="24" fill="#1f2a37"><tspan font-weight="700" fill="#2f5d9b">사례(3절)</tspan> · 고객발굴 하네스 문서는 “저장하지 않는다”에서 멈추지 않고 “그래도 전송은 된다”를 함께 밝힌다</text>

<!-- misconception vs fact -->
<rect x="64" y="595" width="680" height="250" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="92" y="642" font-size="28" font-weight="700" fill="#a33a3a">흔한 오해 (저자 해석)</text>
<text x="92" y="700" font-size="26" fill="#1f2a37"><tspan fill="#a33a3a" font-weight="700">✗ </tspan>“학습에 안 쓴다고 했으니 안전하다”</text>
<text x="92" y="790" font-size="26" fill="#1f2a37"><tspan fill="#a33a3a" font-weight="700">✗ </tspan>“저장 안 된다고 했으니 보내도 된다”</text>

<line x1="744" y1="720" x2="800" y2="720" stroke="#5b7fb5" stroke-width="4" marker-end="url(#ar)"/>

<rect x="804" y="595" width="732" height="250" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="3"/>
<text x="832" y="642" font-size="28" font-weight="700" fill="#2f6f73">실제로는</text>
<text x="832" y="694" font-size="26" fill="#1f2a37">학습에 쓰이지 않아도, 저장되지 않아도</text>
<text x="832" y="730" font-size="26" font-weight="700" fill="#14253d">전송은 일어난다</text>
<text x="832" y="784" font-size="26" fill="#1f2a37">→ 세 질문을 따로 확인한 뒤</text>
<text x="862" y="820" font-size="26" fill="#1f2a37">넣을 정보를 정한다</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
