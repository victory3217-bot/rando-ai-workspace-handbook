<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">일회성 프롬프트 vs 업무 지침서</title>
<desc id="d">일회성 프롬프트와 재사용 가능한 업무 지침서를 쓰임, 내용, 아는 사람, 고치는 법, 검증의 다섯 기준으로 비교하고, 지침서의 가치에 대한 저자 해석을 보여 준다.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH10 · 1/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">일회성 프롬프트 vs 업무 지침서</text>
<text x="64" y="172" font-size="26" fill="#566273">한 번 쓰고 잊는 요청에서, 반복해서 쓰고 고치고 검증하는 문서로</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- header row -->
<rect x="340" y="218" width="480" height="54" rx="12" fill="#e6eef9" stroke="#c9d4e5" stroke-width="2"/>
<text x="580" y="255" font-size="30" font-weight="bold" fill="#14253d" text-anchor="middle">일회성 프롬프트</text>
<rect x="836" y="218" width="700" height="54" rx="12" fill="#2f5d9b"/>
<text x="1186" y="255" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">업무 지침서</text>

<!-- row 1 -->
<rect x="64" y="280" width="260" height="64" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="194" y="322" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">쓰임</text>
<rect x="340" y="280" width="480" height="64" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="580" y="321" font-size="26" fill="#566273" text-anchor="middle">한 번 쓰고 잊음</text>
<rect x="836" y="280" width="700" height="64" rx="12" fill="#e6eef9" stroke="#5b7fb5" stroke-width="2"/>
<text x="1186" y="321" font-size="26" fill="#1f2a37" text-anchor="middle">반복해서 씀</text>

<!-- row 2 -->
<rect x="64" y="352" width="260" height="116" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="194" y="420" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">내용</text>
<rect x="340" y="352" width="480" height="116" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="580" y="419" font-size="26" fill="#566273" text-anchor="middle">요청 한 줄</text>
<rect x="836" y="352" width="700" height="116" rx="12" fill="#e6eef9" stroke="#5b7fb5" stroke-width="2"/>
<text x="1186" y="401" font-size="26" fill="#1f2a37" text-anchor="middle">목적, 범위, 입력 조건, 단계,</text>
<text x="1186" y="437" font-size="26" fill="#1f2a37" text-anchor="middle">형식, 금지, 예외, 검증</text>

<!-- row 3 -->
<rect x="64" y="476" width="260" height="64" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="194" y="518" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">누가 아나</text>
<rect x="340" y="476" width="480" height="64" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="580" y="517" font-size="26" fill="#566273" text-anchor="middle">쓴 사람</text>
<rect x="836" y="476" width="700" height="64" rx="12" fill="#e6eef9" stroke="#5b7fb5" stroke-width="2"/>
<text x="1186" y="517" font-size="26" fill="#1f2a37" text-anchor="middle">나, 동료, AI 서비스</text>

<!-- row 4 -->
<rect x="64" y="548" width="260" height="64" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="194" y="590" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">고치는 법</text>
<rect x="340" y="548" width="480" height="64" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="580" y="589" font-size="26" fill="#566273" text-anchor="middle">그때그때</text>
<rect x="836" y="548" width="700" height="64" rx="12" fill="#e6eef9" stroke="#5b7fb5" stroke-width="2"/>
<text x="1186" y="589" font-size="26" fill="#1f2a37" text-anchor="middle">버전을 올리고 이유를 기록</text>

<!-- row 5 -->
<rect x="64" y="620" width="260" height="64" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="194" y="662" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">검증</text>
<rect x="340" y="620" width="480" height="64" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="580" y="661" font-size="26" fill="#566273" text-anchor="middle">없음</text>
<rect x="836" y="620" width="700" height="64" rx="12" fill="#e6eef9" stroke="#5b7fb5" stroke-width="2"/>
<text x="1186" y="661" font-size="26" fill="#1f2a37" text-anchor="middle">기준과 시험 기록이 있음</text>

<!-- author's interpretation -->
<rect x="64" y="704" width="1472" height="132" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="88" y="744" width="200" height="52" rx="12" fill="#14253d"/>
<text x="188" y="779" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">저자 해석</text>
<text x="316" y="745" font-size="26" fill="#1f2a37">AI가 알아서 잘하게 하는 마법이 아님 — AI는 지침서를 어길 수 있음</text>
<text x="316" y="783" font-size="26" font-weight="bold" fill="#14253d">가치: 기대를 글로 분명히 하고, 어겼을 때 알아채고 고칠 기준을 갖는 것</text>
<text x="316" y="818" font-size="22" fill="#566273">지침서를 쓰면 결과가 좋아진다는 것은 이 책이 검증하지 않았다</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
