<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">검증 원칙: 매번, 양방향으로</title>
<desc id="d">AI 결과를 매번 같은 절차로 검증해야 하는 네 가지 이유와, 원문과 결과를 두 방향으로 대조해 지어낸 것과 빠진 것을 함께 찾는 원리를 보여 준다.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14253d"/></marker>
<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b7fb5"/></marker>
</defs>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH12 · 1/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">검증 원칙: 매번, 양방향으로</text>
<text x="64" y="172" font-size="26" fill="#566273">한 번 잘하는 것보다 매번 같은 절차로 하는 것이 중요하다</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- Left: why verify every time -->
<text x="64" y="252" font-size="28" font-weight="bold" fill="#14253d">왜 매번 검증하나</text>
<rect x="64" y="272" width="560" height="124" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="92" y="322" font-size="28" font-weight="bold" fill="#14253d">AI는 틀릴 수 있다</text>
<text x="92" y="364" font-size="26" fill="#1f2a37">지어냄·숫자 오류·누락 (CH09)</text>
<rect x="64" y="412" width="560" height="124" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="92" y="462" font-size="28" font-weight="bold" fill="#14253d">지침서도 어길 수 있다</text>
<text x="92" y="504" font-size="26" fill="#1f2a37">어겼는지 알아챌 절차 필요 (CH10)</text>
<rect x="64" y="552" width="560" height="124" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="92" y="602" font-size="28" font-weight="bold" fill="#14253d">책임은 사람에게</text>
<text x="92" y="644" font-size="26" fill="#1f2a37">공유·제출하는 순간부터 (CH09)</text>
<rect x="64" y="692" width="560" height="124" rx="12" fill="#e6eef9" stroke="#2f5d9b" stroke-width="2"/>
<text x="92" y="742" font-size="28" font-weight="bold" fill="#14253d">매번 같은 절차로</text>
<text x="92" y="784" font-size="26" fill="#1f2a37">피곤·급할 때도 → 체크리스트</text>

<!-- Right: two-way comparison -->
<rect x="660" y="232" width="876" height="120" rx="12" fill="#ffffff" stroke="#14253d" stroke-width="2"/>
<text x="1098" y="278" text-anchor="middle" font-size="28" font-weight="bold" fill="#14253d">결과 → 원문 · 지어낸 것, 왜곡 찾기</text>
<text x="1098" y="322" text-anchor="middle" font-size="26" fill="#1f2a37">결과의 문장마다 원문 근거를 찾고, 못 찾으면 표시</text>

<rect x="660" y="368" width="220" height="150" rx="12" fill="#14253d"/>
<text x="770" y="455" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffffff">원문</text>
<rect x="1316" y="368" width="220" height="150" rx="12" fill="#2f5d9b"/>
<text x="1426" y="455" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffffff">결과</text>
<line x1="1310" y1="404" x2="888" y2="404" stroke="#14253d" stroke-width="4" marker-end="url(#ah)"/>
<line x1="886" y1="482" x2="1308" y2="482" stroke="#5b7fb5" stroke-width="4" marker-end="url(#ah2)"/>
<text x="1098" y="453" text-anchor="middle" font-size="28" font-weight="bold" fill="#2f5d9b">양방향 대조</text>

<rect x="660" y="534" width="876" height="140" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<text x="1098" y="576" text-anchor="middle" font-size="28" font-weight="bold" fill="#14253d">원문 → 결과 · 누락 찾기</text>
<text x="1098" y="614" text-anchor="middle" font-size="26" fill="#1f2a37">원문의 항목을 하나씩 결과에서 찾는다:</text>
<text x="1098" y="650" text-anchor="middle" font-size="26" fill="#1f2a37">안건, 결정, 담당자, 기한, 미정 사항</text>

<rect x="660" y="690" width="876" height="156" rx="12" fill="#f1f5fb" stroke="#b7791f" stroke-width="2"/>
<text x="1098" y="732" text-anchor="middle" font-size="28" font-weight="bold" fill="#b7791f">한 방향만 하면 놓친다</text>
<text x="1098" y="774" text-anchor="middle" font-size="26" fill="#1f2a37">결과 → 원문만: 빠진 것을 못 찾는다</text>
<text x="1098" y="814" text-anchor="middle" font-size="26" fill="#1f2a37">원문 → 결과만: 끼어든 것을 못 찾는다</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
