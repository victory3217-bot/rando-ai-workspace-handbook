<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">AI 결과물의 오류 유형과 사람의 최종 승인</title>
<desc id="d">AI 결과물에서 나타나는 일곱 가지 오류 유형의 모습과 찾는 방법, 그리고 사람이 최종 승인하는 절차와 책임 원칙을 보여 줍니다.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="700" fill="#2f5d9b">CH09 · 3/3</text>
<text x="64" y="128" font-size="46" font-weight="700" fill="#14253d">AI 결과물의 오류 유형과 사람의 최종 승인</text>
<text x="64" y="172" font-size="26" fill="#566273">오류마다 찾는 방법이 다르고, 고친 결과는 사람이 승인한다</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>
<!-- error matrix -->
<rect x="64" y="222" width="252" height="52" rx="10" fill="#14253d"/>
<text x="190" y="257" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">오류 유형</text>
<rect x="324" y="222" width="392" height="52" rx="10" fill="#14253d"/>
<text x="520" y="257" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">모습</text>
<rect x="724" y="222" width="352" height="52" rx="10" fill="#14253d"/>
<text x="900" y="257" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">찾는 방법</text>
<rect x="64" y="282" width="252" height="72" rx="10" fill="#e6eef9" stroke="#a33a3a" stroke-width="2"/>
<text x="190" y="327" font-size="26" font-weight="700" fill="#14253d" text-anchor="middle">지어냄</text>
<rect x="324" y="282" width="392" height="72" rx="10" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="344" y="326" font-size="24" fill="#1f2a37">메모에 없는 결정·인용·숫자</text>
<rect x="724" y="282" width="352" height="72" rx="10" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="744" y="326" font-size="24" fill="#14253d">문장마다 원문에서 찾기</text>
<rect x="64" y="361" width="252" height="72" rx="10" fill="#e6eef9" stroke="#a33a3a" stroke-width="2"/>
<text x="190" y="406" font-size="26" font-weight="700" fill="#14253d" text-anchor="middle">왜곡</text>
<rect x="324" y="361" width="392" height="72" rx="10" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="344" y="390" font-size="24" fill="#1f2a37">의미가 바뀜</text>
<text x="344" y="421" font-size="24" fill="#1f2a37">(“수정안”→“인하안”)</text>
<rect x="724" y="361" width="352" height="72" rx="10" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="744" y="405" font-size="24" fill="#14253d">핵심 단어를 원문과 비교</text>
<rect x="64" y="440" width="252" height="72" rx="10" fill="#e6eef9" stroke="#a33a3a" stroke-width="2"/>
<text x="190" y="485" font-size="26" font-weight="700" fill="#14253d" text-anchor="middle">누락</text>
<rect x="324" y="440" width="392" height="72" rx="10" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="344" y="469" font-size="24" fill="#1f2a37">있던 항목이 빠짐</text>
<text x="344" y="500" font-size="24" fill="#1f2a37">(미결 사항)</text>
<rect x="724" y="440" width="352" height="72" rx="10" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="744" y="469" font-size="24" fill="#14253d">원문과 결과의</text>
<text x="744" y="500" font-size="24" fill="#14253d">항목 수 비교</text>
<rect x="64" y="519" width="252" height="72" rx="10" fill="#e6eef9" stroke="#a33a3a" stroke-width="2"/>
<text x="190" y="564" font-size="26" font-weight="700" fill="#14253d" text-anchor="middle">계산 오류</text>
<rect x="324" y="519" width="392" height="72" rx="10" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="344" y="563" font-size="24" fill="#1f2a37">합계·평균·비율이 틀림</text>
<rect x="724" y="519" width="352" height="72" rx="10" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="744" y="563" font-size="24" fill="#14253d">직접 재계산</text>
<rect x="64" y="598" width="252" height="72" rx="10" fill="#e6eef9" stroke="#a33a3a" stroke-width="2"/>
<text x="190" y="643" font-size="26" font-weight="700" fill="#14253d" text-anchor="middle">형식 위반</text>
<rect x="324" y="598" width="392" height="72" rx="10" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="344" y="642" font-size="24" fill="#1f2a37">요청한 표 형식이 아님</text>
<rect x="724" y="598" width="352" height="72" rx="10" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="744" y="642" font-size="24" fill="#14253d">요청문 ④와 비교</text>
<rect x="64" y="677" width="252" height="72" rx="10" fill="#e6eef9" stroke="#a33a3a" stroke-width="2"/>
<text x="190" y="722" font-size="26" font-weight="700" fill="#14253d" text-anchor="middle">과잉 확신</text>
<rect x="324" y="677" width="392" height="72" rx="10" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="344" y="721" font-size="24" fill="#1f2a37">모르는 것을 단정</text>
<rect x="724" y="677" width="352" height="72" rx="10" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="744" y="706" font-size="24" fill="#14253d">“확인 필요” 표시가</text>
<text x="744" y="737" font-size="24" fill="#14253d">있어야 할 곳 점검</text>
<rect x="64" y="756" width="252" height="72" rx="10" fill="#e6eef9" stroke="#a33a3a" stroke-width="2"/>
<text x="190" y="801" font-size="26" font-weight="700" fill="#14253d" text-anchor="middle">출처 혼동</text>
<rect x="324" y="756" width="392" height="72" rx="10" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="344" y="800" font-size="24" fill="#1f2a37">입력에 없는 출처를 댐</text>
<rect x="724" y="756" width="352" height="72" rx="10" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="744" y="785" font-size="24" fill="#14253d">출처가 입력자료에</text>
<text x="744" y="816" font-size="24" fill="#14253d">있는지 확인</text>
<!-- approval -->
<rect x="1116" y="222" width="420" height="52" rx="10" fill="#14253d"/>
<text x="1326" y="257" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">사람의 최종 승인</text>
<line x1="1156" y1="300" x2="1156" y2="610" stroke="#5b7fb5" stroke-width="3"/>
<rect x="1116" y="286" width="420" height="76" rx="10" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<rect x="1132" y="300" width="48" height="48" rx="10" fill="#2f5d9b"/>
<text x="1156" y="333" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="1196" y="317" font-size="24" fill="#1f2a37">사실 확인표를</text>
<text x="1196" y="348" font-size="24" fill="#1f2a37">끝까지 채운다</text>
<rect x="1116" y="374" width="420" height="76" rx="10" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<rect x="1132" y="388" width="48" height="48" rx="10" fill="#2f5d9b"/>
<text x="1156" y="421" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="1196" y="405" font-size="24" fill="#1f2a37">틀린 곳을 고친</text>
<text x="1196" y="436" font-size="24" fill="#1f2a37">수정본을 만든다</text>
<rect x="1116" y="462" width="420" height="76" rx="10" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<rect x="1132" y="476" width="48" height="48" rx="10" fill="#2f5d9b"/>
<text x="1156" y="509" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="1196" y="493" font-size="24" fill="#1f2a37">승인자가 확인한</text>
<text x="1196" y="524" font-size="24" fill="#1f2a37">항목과 날짜를 적는다</text>
<rect x="1116" y="550" width="420" height="76" rx="10" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<rect x="1132" y="564" width="48" height="48" rx="10" fill="#2f5d9b"/>
<text x="1156" y="597" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="1196" y="581" font-size="24" fill="#1f2a37">승인한 파일만 03_최종에</text>
<text x="1196" y="612" font-size="24" fill="#1f2a37">두고 공유한다</text>
<rect x="1116" y="644" width="420" height="190" rx="12" fill="#e6eef9" stroke="#14253d" stroke-width="3"/>
<text x="1326" y="700" font-size="25" font-weight="700" fill="#14253d" text-anchor="middle">AI가 썼더라도</text>
<text x="1326" y="732" font-size="25" font-weight="700" fill="#14253d" text-anchor="middle">내용의 책임은</text>
<text x="1326" y="764" font-size="25" font-weight="700" fill="#14253d" text-anchor="middle">승인한 사람에게 있다</text>
<text x="1326" y="796" font-size="25" fill="#566273" text-anchor="middle">(이 책의 입장, 저자 해석)</text>
<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
