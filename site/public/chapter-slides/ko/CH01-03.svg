<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">워크스페이스 · 워크플로 · 하네스</title>
<desc id="d">이 책의 작업 정의에 따라 워크스페이스(환경), 워크플로(단계와 절차), 하네스(AI의 수행을 지원하고 통제하는 실행 체계)를 서로 다른 초점으로 구분하고, 하네스가 워크플로의 단계와 워크스페이스의 자료·도구를 쓸 수 있어 서로 배제하는 분류가 아님을 보여 준다.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9b"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH01 · 3/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">워크스페이스 · 워크플로 · 하네스는 어떻게 다른가</text>
<text x="64" y="172" font-size="26" fill="#566273">이 책의 작업 정의(업계 표준 정의 아님) · 같은 일을 서로 다른 초점으로 설명한다</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- Outer: workspace -->
<rect x="64" y="220" width="1472" height="626" rx="12" fill="#e6eef9" stroke="#2f5d9b" stroke-width="2"/>
<text x="96" y="262" font-size="30" font-weight="bold" fill="#14253d">AI 워크스페이스 — 일이 벌어지는 환경</text>
<text x="96" y="298" font-size="24" fill="#1f2a37">자료 · AI 도구 · 연결 · 접근 권한 · 지침 · 사람의 역할을 조직해 둔 환경 전체</text>
<text x="96" y="332" font-size="24" font-weight="bold" fill="#2f5d9b">Q. 일에 필요한 것들이 갖춰지고 정리되어 있는가?</text>

<!-- Workflow -->
<rect x="96" y="352" width="540" height="396" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="96" y="352" width="540" height="54" rx="12" fill="#5b7fb5"/>
<text x="366" y="389" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">AI 워크플로</text>
<text x="366" y="442" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">업무를 수행하는 단계와 절차</text>
<text x="366" y="476" font-size="24" font-weight="bold" fill="#2f5d9b" text-anchor="middle">Q. 어떤 순서로 하는가?</text>
<rect x="126" y="490" width="480" height="44" rx="12" fill="#f1f5fb" stroke="#c9d4e5"/>
<text x="146" y="520" font-size="24" fill="#1f2a37">1  상품 설명을 준다</text>
<rect x="126" y="538" width="480" height="44" rx="12" fill="#f1f5fb" stroke="#c9d4e5"/>
<text x="146" y="568" font-size="24" fill="#1f2a37">2  초안을 받는다</text>
<rect x="126" y="586" width="480" height="44" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="2"/>
<text x="146" y="616" font-size="24" fill="#1f2a37">3  가격 · 일정이 맞는지 확인한다</text>
<rect x="126" y="634" width="480" height="44" rx="12" fill="#f1f5fb" stroke="#c9d4e5"/>
<text x="146" y="664" font-size="24" fill="#1f2a37">4  내가 최종 결정해서 올린다</text>
<text x="366" y="720" font-size="24" fill="#2f6f73" text-anchor="middle">검증 단계가 들어 있어도 워크플로</text>

<!-- Relation arrow -->
<text x="728" y="510" font-size="24" fill="#14253d" text-anchor="middle">단계를 포함</text>
<text x="728" y="542" font-size="24" fill="#14253d" text-anchor="middle">하거나 활용</text>
<line x1="816" y1="572" x2="644" y2="572" stroke="#2f5d9b" stroke-width="3" marker-end="url(#ah)"/>

<!-- Harness -->
<rect x="820" y="352" width="684" height="396" rx="12" fill="#ffffff" stroke="#14253d" stroke-width="2"/>
<rect x="820" y="352" width="684" height="54" rx="12" fill="#14253d"/>
<text x="1162" y="389" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">AI 하네스</text>
<text x="1162" y="442" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">AI가 특정 업무를 수행하도록</text>
<text x="1162" y="476" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">지원하고 통제하는 실행 체계</text>
<rect x="848" y="490" width="300" height="44" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="998" y="520" font-size="24" fill="#1f2a37" text-anchor="middle">실행 규칙</text>
<rect x="1164" y="490" width="312" height="44" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="1320" y="520" font-size="24" fill="#1f2a37" text-anchor="middle">도구</text>
<rect x="848" y="538" width="300" height="44" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="998" y="568" font-size="24" fill="#1f2a37" text-anchor="middle">절차</text>
<rect x="1164" y="538" width="312" height="44" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="1320" y="568" font-size="24" fill="#1f2a37" text-anchor="middle">입력 · 출력 조건</text>
<rect x="848" y="586" width="300" height="44" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="998" y="616" font-size="24" fill="#1f2a37" text-anchor="middle">검증 기준</text>
<rect x="1164" y="586" width="312" height="44" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="1320" y="616" font-size="24" fill="#1f2a37" text-anchor="middle">예외 처리</text>
<text x="1162" y="672" font-size="24" font-weight="bold" fill="#2f5d9b" text-anchor="middle">Q. 어떤 규칙과 조건 안에서 일하고, 결과를 어떻게</text>
<text x="1162" y="706" font-size="24" font-weight="bold" fill="#2f5d9b" text-anchor="middle">확인하며, 어긋나면 어떻게 하는가?</text>

<!-- Relation band -->
<rect x="96" y="758" width="1408" height="80" rx="12" fill="#ffffff" stroke="#c9d4e5"/>
<text x="800" y="790" font-size="24" fill="#1f2a37" text-anchor="middle"><tspan font-weight="bold" fill="#14253d">서로 배제하는 분류가 아니다</tspan> → '어떤 측면을 설명하는 말인가'로 구분한다</text>
<text x="800" y="824" font-size="24" fill="#1f2a37" text-anchor="middle">하네스는 워크스페이스의 자료와 도구를 쓸 수 있고, 단지 '더 체계적인 워크플로'가 아니다</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
