<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">챗봇 · 워크플로 · 에이전트 · 하네스</title>
<desc id="d">이 책의 작업 정의에 따라 AI 챗봇, AI Workflow, AI 에이전트, AI 하네스를 AI 워크스페이스 안의 서로 다른 초점으로 놓고, 하나의 고정된 계층이 아닌 관계를 보여 주며, 에이전트에도 사람의 승인 지점과 좁은 권한 범위를 둘 수 있음을 짚는다.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9b"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH01 · 3/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">챗봇 · 워크플로 · 에이전트 · 하네스는 어떻게 다른가</text>
<text x="64" y="172" font-size="24" fill="#566273">이 책의 작업 정의(업계 표준 정의 아님) · 에이전트는 업체마다 다르게 정의한다 · 네 말은 서로 다른 초점</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- Outer: workspace -->
<rect x="64" y="214" width="1472" height="544" rx="12" fill="#e6eef9" stroke="#2f5d9b" stroke-width="2"/>
<text x="96" y="250" font-size="24" fill="#1f2a37"><tspan font-size="28" font-weight="bold" fill="#14253d">AI 워크스페이스</tspan> — 이들이 일하는 환경과 자료 · 도구 · 관리 체계를 아우를 수 있다</text>

<!-- Chatbot (top left) -->
<rect x="96" y="264" width="420" height="206" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="96" y="264" width="420" height="52" rx="12" fill="#5b7fb5"/>
<text x="306" y="302" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">AI 챗봇</text>
<text x="120" y="348" font-size="24" fill="#1f2a37">주로 사용자와 대화하며</text>
<text x="120" y="378" font-size="24" fill="#1f2a37">질문 · 요청에 응답한다</text>
<text x="120" y="416" font-size="24" font-weight="bold" fill="#2f5d9b">Q. 무엇을 물으면</text>
<text x="120" y="446" font-size="24" font-weight="bold" fill="#2f5d9b">어떻게 답하는가?</text>

<!-- Hierarchy note (top gutter) -->
<rect x="532" y="274" width="288" height="188" rx="12" fill="#f1f5fb" stroke="#5b7fb5" stroke-width="2" stroke-dasharray="8 6"/>
<text x="676" y="308" font-size="24" font-weight="bold" fill="#14253d" text-anchor="middle">고정된 계층이 아니다</text>
<text x="676" y="340" font-size="24" fill="#1f2a37" text-anchor="middle">‘하네스 ⊃ 에이전트</text>
<text x="676" y="370" font-size="24" fill="#1f2a37" text-anchor="middle">⊃ 워크플로’ 아님</text>
<text x="676" y="402" font-size="24" fill="#1f2a37" text-anchor="middle">보는 면에 따라</text>
<text x="676" y="432" font-size="24" fill="#1f2a37" text-anchor="middle">연결되거나 포함될 수 있다</text>

<!-- Harness (top right) -->
<rect x="836" y="264" width="668" height="206" rx="12" fill="#ffffff" stroke="#14253d" stroke-width="2"/>
<rect x="836" y="264" width="668" height="52" rx="12" fill="#14253d"/>
<text x="1170" y="302" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">AI 하네스</text>
<text x="860" y="348" font-size="24" fill="#1f2a37">AI가 특정 업무를 수행하도록 지원 · 통제하는 실행 체계</text>
<text x="860" y="378" font-size="24" fill="#1f2a37">규칙 · 도구 · 권한 · 상태 · 검증 · 평가 등이 포함될 수 있다</text>
<text x="860" y="416" font-size="24" font-weight="bold" fill="#2f5d9b">Q. 어떤 규칙과 조건 안에서 일하고, 결과를 어떻게</text>
<text x="860" y="446" font-size="24" font-weight="bold" fill="#2f5d9b">확인하며, 어긋나면 어떻게 하는가?</text>

<!-- Harness -> Agent -->
<line x1="1484" y1="474" x2="1484" y2="534" stroke="#14253d" stroke-width="3" marker-end="url(#ah)"/>
<text x="1464" y="498" font-size="24" fill="#14253d" text-anchor="end"><tspan font-weight="bold">에이전트를 지원 · 통제할 수 있다</tspan> — 그러나 에이전트와 같은 말이 아니다</text>
<text x="1464" y="528" font-size="24" fill="#1f2a37" text-anchor="end">에이전트가 할 수 있는 일의 범위는 도구 · 권한 · 검증 구조에 따라 달라진다</text>

<!-- Workflow (bottom left) -->
<rect x="96" y="540" width="420" height="206" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="96" y="540" width="420" height="52" rx="12" fill="#5b7fb5"/>
<text x="306" y="578" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Workflow(워크플로)</text>
<text x="120" y="624" font-size="24" fill="#1f2a37">업무를 수행하는</text>
<text x="120" y="654" font-size="24" fill="#1f2a37">단계와 처리 흐름</text>
<text x="120" y="692" font-size="24" font-weight="bold" fill="#2f5d9b">Q. 어떤 순서로 하는가?</text>

<!-- Agent -> Workflow -->
<text x="676" y="584" font-size="24" fill="#14253d" text-anchor="middle">에이전트는 워크플로의</text>
<text x="676" y="614" font-size="24" fill="#14253d" text-anchor="middle">한 단계로 작동할 수 있다</text>
<line x1="830" y1="640" x2="522" y2="640" stroke="#2f5d9b" stroke-width="3" marker-end="url(#ah)"/>
<text x="676" y="672" font-size="24" fill="#1f2a37" text-anchor="middle">워크플로에 에이전트가</text>
<text x="676" y="702" font-size="24" fill="#1f2a37" text-anchor="middle">반드시 필요하지는 않다</text>

<!-- Agent (bottom right) -->
<rect x="836" y="540" width="668" height="206" rx="12" fill="#ffffff" stroke="#2f5d9b" stroke-width="2"/>
<rect x="836" y="540" width="668" height="52" rx="12" fill="#2f5d9b"/>
<text x="1170" y="578" font-size="24" fill="#ffffff" text-anchor="middle"><tspan font-size="28" font-weight="bold">AI 에이전트</tspan> — 행동한다(Tool Use): 도구와 권한이 핵심</text>
<text x="860" y="624" font-size="24" fill="#1f2a37">주어진 목표와 허용된 권한 범위 안에서 상황을 파악하고,</text>
<text x="860" y="654" font-size="24" fill="#1f2a37">필요한 행동을 고르며, 도구를 사용해 작업을 진행한다</text>
<text x="860" y="692" font-size="24" font-weight="bold" fill="#2f5d9b">Q. 목표와 지금 상황에서 무엇을 하고,</text>
<text x="860" y="722" font-size="24" font-weight="bold" fill="#2f5d9b">어떤 도구와 권한을 쓰는가?</text>

<!-- Caution band -->
<rect x="64" y="770" width="1472" height="80" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
<text x="92" y="802" font-size="24" font-weight="bold" fill="#b7791f">모든 에이전트가 완전히 자율적이거나 사람의 감독 없이 실행되는 것은 아니다</text>
<text x="92" y="834" font-size="24" fill="#1f2a37">→ 사람의 승인 지점(Human-in-the-loop)을 두거나 권한 범위(Permission Boundary)를 좁게 정해 쓸 수 있다</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
