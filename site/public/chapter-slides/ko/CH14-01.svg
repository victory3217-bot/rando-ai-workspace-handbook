<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">완성된 AI 워크스페이스의 구조</title>
<desc id="d">CH02의 다섯 칸(PC·로컬 파일, 클라우드 저장소, AI 작업환경, 업무문서와 지식베이스, 지침서와 확인 기록)에 각 장의 산출물이 들어가고, 목적·정보 등급·결과물이 전체를 묶는다는 구조를 보여 줍니다. 연결 점검표와 최종 구성도로 이 구조를 확인합니다.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH14 · 1/3</text>
