<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">항목별 검증과 오류 대응</title>
<desc id="d">숫자, 날짜·기한, 인물, 출처를 각각 어떻게 확인하고 어떤 오류가 자주 나는지 표로 보여 주고, 누락·형식 오류의 뜻과 근거 없이 생성된 내용에 대응하는 네 단계를 정리한다.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH12 · 2/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">항목별 검증과 오류 대응</text>
<text x="64" y="172" font-size="26" fill="#566273">숫자·날짜·인물·출처는 하나씩, 누락·형식 오류·지어냄은 따로 다룬다</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- Matrix header -->
<rect x="64" y="216" width="220" height="52" rx="12" fill="#14253d"/>
<text x="174" y="251" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">항목</text>
<rect x="296" y="216" width="704" height="52" rx="12" fill="#14253d"/>
<text x="648" y="251" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">확인 방법</text>
<rect x="1012" y="216" width="524" height="52" rx="12" fill="#14253d"/>
<text x="1274" y="251" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">자주 나는 오류</text>

<!-- Row 1: numbers -->
<rect x="64" y="274" width="220" height="84" rx="12" fill="#e6eef9"/>
<text x="174" y="326" text-anchor="middle" font-size="28" font-weight="bold" fill="#14253d">숫자</text>
<rect x="296" y="274" width="704" height="84" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="320" y="309" font-size="26" fill="#1f2a37">원문과 한 글자씩 비교, 단위 확인</text>
<text x="320" y="343" font-size="26" fill="#1f2a37">합계·비율은 직접 재계산</text>
<rect x="1012" y="274" width="524" height="84" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="1036" y="326" font-size="26" fill="#1f2a37">자릿수, 단위, 합계 오류</text>

<!-- Row 2: dates -->
<rect x="64" y="364" width="220" height="84" rx="12" fill="#e6eef9"/>
<text x="174" y="416" text-anchor="middle" font-size="28" font-weight="bold" fill="#14253d">날짜·기한</text>
<rect x="296" y="364" width="704" height="84" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="320" y="399" font-size="26" fill="#1f2a37">원문의 표현 그대로인가</text>
<text x="320" y="433" font-size="26" fill="#1f2a37">“다음 주까지”를 요일·날짜로 바꾸지 않았나</text>
<rect x="1012" y="364" width="524" height="84" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="1036" y="399" font-size="26" fill="#1f2a37">없는 요일·날짜 추가</text>
<text x="1036" y="433" font-size="26" fill="#1f2a37">하루 차이</text>

<!-- Row 3: people -->
<rect x="64" y="454" width="220" height="84" rx="12" fill="#e6eef9"/>
<text x="174" y="506" text-anchor="middle" font-size="28" font-weight="bold" fill="#14253d">인물</text>
<rect x="296" y="454" width="704" height="84" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="320" y="489" font-size="26" fill="#1f2a37">이름과 역할(담당, 검토)이</text>
<text x="320" y="523" font-size="26" fill="#1f2a37">원문의 짝과 같은가</text>
<rect x="1012" y="454" width="524" height="84" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="1036" y="489" font-size="26" fill="#1f2a37">담당자·검토자가 뒤바뀜</text>
<text x="1036" y="523" font-size="26" fill="#1f2a37">다른 사람 이름</text>

<!-- Row 4: sources -->
<rect x="64" y="544" width="220" height="84" rx="12" fill="#e6eef9"/>
<text x="174" y="596" text-anchor="middle" font-size="28" font-weight="bold" fill="#14253d">출처</text>
<rect x="296" y="544" width="704" height="84" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="320" y="579" font-size="26" fill="#1f2a37">인용한 문서 번호(예: K01)가 인덱스(CH08)에</text>
<text x="320" y="613" font-size="26" fill="#1f2a37">실제로 있고 내용이 맞는가</text>
<rect x="1012" y="544" width="524" height="84" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="1036" y="579" font-size="26" fill="#1f2a37">없는 문서 번호</text>
<text x="1036" y="613" font-size="26" fill="#1f2a37">있는 문서를 잘못 설명</text>

<!-- Bottom left: omission and format error -->
<rect x="64" y="642" width="796" height="196" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<text x="92" y="680" font-size="26" fill="#1f2a37"><tspan font-weight="bold" fill="#14253d">누락</tspan>  원문의 안건, 미정 사항,</text>
<text x="92" y="714" font-size="26" fill="#1f2a37">“확인 필요” 표시가 결과에서 빠짐</text>
<text x="92" y="756" font-size="26" fill="#1f2a37"><tspan font-weight="bold" fill="#14253d">형식 오류</tspan>  CH10 지침서 4절 결과물 형식과 다름</text>
<text x="92" y="790" font-size="26" fill="#1f2a37">→ 내용이 맞아도 규칙 위반: 기록한다</text>
<text x="92" y="824" font-size="26" fill="#1f2a37">→ 반복되면: 결과물 형식 문장이 모호하다는 신호</text>

<!-- Bottom right: fabrication response -->
<rect x="880" y="642" width="656" height="196" rx="12" fill="#ffffff" stroke="#a33a3a" stroke-width="2"/>
<text x="908" y="682" font-size="28" font-weight="bold" fill="#a33a3a">근거 없이 생성했다면</text>
<text x="908" y="720" font-size="26" fill="#1f2a37">① 쓰지 않는다: 삭제 또는 “확인 필요”</text>
<text x="908" y="754" font-size="26" fill="#1f2a37">② 원인 찾기: 입력, 지침서, 요청 범위</text>
<text x="908" y="788" font-size="26" fill="#1f2a37">③ 재발 방지: 지침서와 시험 사례에 추가</text>
<text x="908" y="822" font-size="26" fill="#1f2a37">④ 기록: 오류 유형 “지어냄”</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
