<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">초안 문장 나누기: 사실·추론·가정·미확인</title>
<desc id="d">AI 초안의 문장을 원문과 대조해 사실, 추론, 가정, 미확인 정보로 나누고, 각각을 최종 결과물에서 어떻게 다루는지 보여 줍니다.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><polygon points="0,0 10,5 0,10" fill="#5b7fb5"/></marker>
</defs>
<text x="64" y="70" font-size="22" font-weight="700" fill="#2f5d9b">CH09 · 2/3</text>
<text x="64" y="128" font-size="46" font-weight="700" fill="#14253d">초안 문장 나누기: 사실·추론·가정·미확인</text>
<text x="64" y="172" font-size="26" fill="#566273">원문에 적혀 있는가로 나누고, 구분마다 다루는 법이 다르다</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<rect x="400" y="216" width="800" height="54" rx="12" fill="#14253d"/>
<text x="800" y="252" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">AI 초안의 문장을 원문(메모)과 한 문장씩 대조</text>
<path d="M800 270 V292 M239 292 H1361" stroke="#5b7fb5" stroke-width="3" fill="none"/>
<line x1="239" y1="292" x2="239" y2="318" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ar)"/>
<line x1="613" y1="292" x2="613" y2="318" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ar)"/>
<line x1="987" y1="292" x2="987" y2="318" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ar)"/>
<line x1="1361" y1="292" x2="1361" y2="318" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ar)"/>

<!-- column 1: fact -->
<rect x="64" y="322" width="350" height="294" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="3"/>
<text x="239" y="368" font-size="32" font-weight="700" fill="#2f6f73" text-anchor="middle">사실</text>
<text x="239" y="412" font-size="25" fill="#1f2a37" text-anchor="middle">원문에 그대로 적혀</text>
<text x="239" y="444" font-size="25" fill="#1f2a37" text-anchor="middle">있어 확인할 수 있음</text>
<rect x="80" y="466" width="318" height="136" rx="10" fill="#f1f5fb"/>
<text x="239" y="508" font-size="24" fill="#1f2a37" text-anchor="middle">“팀장A는 인하에</text>
<text x="239" y="540" font-size="24" fill="#1f2a37" text-anchor="middle">반대했다”</text>
<text x="239" y="578" font-size="24" fill="#566273" text-anchor="middle">(메모에 있음)</text>
<line x1="239" y1="618" x2="239" y2="640" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ar)"/>
<rect x="64" y="644" width="350" height="78" rx="12" fill="#e6eef9" stroke="#2f6f73" stroke-width="2"/>
<text x="239" y="692" font-size="26" font-weight="700" fill="#14253d" text-anchor="middle">그대로 쓴다</text>

<!-- column 2: inference -->
<rect x="438" y="322" width="350" height="294" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="3"/>
<text x="613" y="368" font-size="32" font-weight="700" fill="#b7791f" text-anchor="middle">추론</text>
<text x="613" y="412" font-size="25" fill="#1f2a37" text-anchor="middle">사실에서 이끌어 낸</text>
<text x="613" y="444" font-size="25" fill="#1f2a37" text-anchor="middle">판단, 원문에는 없음</text>
<rect x="454" y="466" width="318" height="136" rx="10" fill="#f1f5fb"/>
<text x="613" y="508" font-size="24" fill="#1f2a37" text-anchor="middle">“단가 인하가</text>
<text x="613" y="540" font-size="24" fill="#1f2a37" text-anchor="middle">부담스러웠던 것 같다”</text>
<text x="613" y="578" font-size="24" fill="#566273" text-anchor="middle">(메모에 없음)</text>
<line x1="613" y1="618" x2="613" y2="640" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ar)"/>
<rect x="438" y="644" width="350" height="78" rx="12" fill="#e6eef9" stroke="#b7791f" stroke-width="2"/>
<text x="613" y="676" font-size="24" font-weight="700" fill="#14253d" text-anchor="middle">추론이라고 표시하거나</text>
<text x="613" y="706" font-size="24" font-weight="700" fill="#14253d" text-anchor="middle">쓰지 않는다</text>

<!-- column 3: assumption -->
<rect x="812" y="322" width="350" height="294" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="3"/>
<text x="987" y="368" font-size="32" font-weight="700" fill="#b7791f" text-anchor="middle">가정</text>
<text x="987" y="412" font-size="25" fill="#1f2a37" text-anchor="middle">확인하지 않은 채</text>
<text x="987" y="444" font-size="25" fill="#1f2a37" text-anchor="middle">그렇다고 놓은 전제</text>
<rect x="828" y="466" width="318" height="136" rx="10" fill="#f1f5fb"/>
<text x="987" y="508" font-size="24" fill="#1f2a37" text-anchor="middle">“대리B가 다음 주</text>
<text x="987" y="540" font-size="24" fill="#1f2a37" text-anchor="middle">화요일까지 보낼 것이다”</text>
<text x="987" y="578" font-size="24" fill="#566273" text-anchor="middle">(메모: “다음 주까지”)</text>
<line x1="987" y1="618" x2="987" y2="640" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ar)"/>
<rect x="812" y="644" width="350" height="78" rx="12" fill="#e6eef9" stroke="#b7791f" stroke-width="2"/>
<text x="987" y="676" font-size="24" font-weight="700" fill="#14253d" text-anchor="middle">가정이라고 표시하고</text>
<text x="987" y="706" font-size="24" font-weight="700" fill="#14253d" text-anchor="middle">확인한다</text>

<!-- column 4: unconfirmed -->
<rect x="1186" y="322" width="350" height="294" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="3"/>
<text x="1361" y="368" font-size="32" font-weight="700" fill="#2f5d9b" text-anchor="middle">미확인</text>
<text x="1361" y="412" font-size="25" fill="#1f2a37" text-anchor="middle">아직 사실인지</text>
<text x="1361" y="444" font-size="25" fill="#1f2a37" text-anchor="middle">알 수 없는 정보</text>
<rect x="1202" y="466" width="318" height="136" rx="10" fill="#f1f5fb"/>
<text x="1361" y="524" font-size="24" fill="#1f2a37" text-anchor="middle">“다음 회의 날짜”</text>
<text x="1361" y="562" font-size="24" fill="#566273" text-anchor="middle">(메모: 미정)</text>
<line x1="1361" y1="618" x2="1361" y2="640" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ar)"/>
<rect x="1186" y="644" width="350" height="78" rx="12" fill="#e6eef9" stroke="#5b7fb5" stroke-width="2"/>
<text x="1361" y="692" font-size="26" font-weight="700" fill="#14253d" text-anchor="middle">“확인 필요”로 둔다</text>

<!-- rule band -->
<rect x="64" y="742" width="1472" height="88" rx="12" fill="#2f5d9b"/>
<text x="800" y="776" font-size="25" font-weight="700" fill="#ffffff" text-anchor="middle">규칙: 최종 결과물에는 사실만 쓴다 · 추론과 가정은 눈에 띄게 표시한다</text>
<text x="800" y="814" font-size="25" fill="#ffffff" text-anchor="middle">미확인은 비워 두지 말고 “확인 필요” · AI가 이 구분을 지키게 하려면 요청문 ⑤ 규칙에 적는다</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
