<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">입력 → 처리 → 검증 → 출력</title>
<desc id="d">후보 A(회의록 정리)의 흐름도 예로, 입력·처리·검증·출력 단계마다 사람과 AI가 맡는 일, 승인 지점, 중단 조건과 수정 후 되돌아가는 경로를 보여 준다.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b7fb5"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a33a3a"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH11 · 2/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">입력 → 처리 → 검증 → 출력</text>
<text x="64" y="172" font-size="26" fill="#566273">후보 A(회의록 정리) 흐름도 예: 누가 무엇을 하고, 어디서 사람이 멈추고 승인하나</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- phases -->
<rect x="64" y="228" width="220" height="62" rx="12" fill="#14253d"/>
<text x="174" y="268" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">입력</text>
<rect x="64" y="318" width="220" height="152" rx="12" fill="#2f5d9b"/>
<text x="174" y="404" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">처리</text>
<rect x="64" y="498" width="220" height="152" rx="12" fill="#5b7fb5"/>
<text x="174" y="584" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">검증</text>
<rect x="64" y="678" width="220" height="152" rx="12" fill="#14253d"/>
<text x="174" y="764" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">출력</text>

<!-- vertical flow arrows -->
<line x1="788" y1="292" x2="788" y2="315" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ah)"/>
<line x1="788" y1="382" x2="788" y2="405" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ah)"/>
<line x1="788" y1="472" x2="788" y2="495" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ah)"/>
<line x1="788" y1="562" x2="788" y2="585" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ah)"/>
<line x1="788" y1="652" x2="788" y2="675" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ah)"/>
<line x1="788" y1="742" x2="788" y2="765" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ah)"/>
<text x="804" y="402" font-size="22" fill="#2f6f73">이상 없음</text>
<text x="804" y="672" font-size="22" fill="#2f6f73">예</text>

<!-- n0 input -->
<rect x="300" y="228" width="820" height="62" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="324" y="268" font-size="26" fill="#1f2a37">회의 메모 (가린 것, CH03 B)</text>
<!-- n1 -->
<rect x="300" y="318" width="140" height="62" rx="12" fill="#ffffff" stroke="#14253d" stroke-width="2"/>
<text x="370" y="358" font-size="24" font-weight="bold" fill="#14253d" text-anchor="middle">사람</text>
<rect x="456" y="318" width="664" height="62" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="480" y="358" font-size="26" fill="#1f2a37">1. 메모의 등급과 가림 상태 확인</text>
<!-- n2 -->
<rect x="300" y="408" width="140" height="62" rx="12" fill="#2f5d9b"/>
<text x="370" y="448" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">AI</text>
<rect x="456" y="408" width="664" height="62" rx="12" fill="#e6eef9"/>
<text x="480" y="448" font-size="26" fill="#1f2a37">2. 지침서(v02)대로 회의록 초안 작성</text>
<!-- n3 -->
<rect x="300" y="498" width="140" height="62" rx="12" fill="#ffffff" stroke="#14253d" stroke-width="2"/>
<text x="370" y="538" font-size="24" font-weight="bold" fill="#14253d" text-anchor="middle">사람</text>
<rect x="456" y="498" width="664" height="62" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="480" y="538" font-size="26" fill="#1f2a37">3. 사실 확인표로 원문 대조, 숫자 재계산</text>
<!-- n4 approval -->
<rect x="300" y="588" width="140" height="62" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="3"/>
<text x="370" y="628" font-size="24" font-weight="bold" fill="#b7791f" text-anchor="middle">승인자</text>
<rect x="456" y="588" width="664" height="62" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="3"/>
<text x="480" y="628" font-size="26" font-weight="bold" fill="#14253d">◆ 승인 지점: 팀장이 내용을 확인했는가?</text>
<!-- n5 -->
<rect x="300" y="678" width="140" height="62" rx="12" fill="#ffffff" stroke="#14253d" stroke-width="2"/>
<text x="370" y="718" font-size="24" font-weight="bold" fill="#14253d" text-anchor="middle">사람</text>
<rect x="456" y="678" width="664" height="62" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="480" y="718" font-size="26" fill="#1f2a37">4. 최종본 저장(03_최종), 승인 기록</text>
<!-- n6 output -->
<rect x="300" y="768" width="820" height="62" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="324" y="808" font-size="26" fill="#1f2a37">팀에 공유 (사람이 직접 발송)</text>

<!-- branch: stop -->
<line x1="1122" y1="349" x2="1166" y2="349" stroke="#a33a3a" stroke-width="3" marker-end="url(#ahr)"/>
<rect x="1170" y="296" width="366" height="110" rx="12" fill="#ffffff" stroke="#a33a3a" stroke-width="3"/>
<text x="1192" y="330" font-size="22" font-weight="bold" fill="#a33a3a">조건: 개인정보 있음</text>
<text x="1192" y="362" font-size="24" fill="#1f2a37">중단: 처리하지 않고</text>
<text x="1192" y="392" font-size="24" fill="#1f2a37">담당자에게 알림</text>

<!-- branch: fix loop -->
<line x1="1122" y1="619" x2="1166" y2="619" stroke="#b7791f" stroke-width="3" marker-end="url(#aha)"/>
<rect x="1170" y="580" width="366" height="80" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="3"/>
<text x="1192" y="612" font-size="22" font-weight="bold" fill="#b7791f">아니오</text>
<text x="1192" y="644" font-size="24" fill="#1f2a37">수정 후 3으로 돌아감</text>
<path d="M1353 578 V529 H1126" fill="none" stroke="#b7791f" stroke-width="3" marker-end="url(#aha)"/>

<!-- SOP note -->
<rect x="1170" y="684" width="366" height="146" rx="12" fill="#e6eef9"/>
<text x="1192" y="728" font-size="24" font-weight="bold" fill="#14253d">표준 실행 절차(SOP)</text>
<text x="1192" y="768" font-size="24" fill="#1f2a37">이 흐름도를 번호 순서의</text>
<text x="1192" y="804" font-size="24" fill="#1f2a37">문장으로 옮긴 것</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
