<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">Claude 프로젝트의 구성과 작동 원리</title>
<desc id="d">프로젝트 안에서 지침과 지식이 모든 대화에 적용되고, 대화끼리는 지식에 넣은 것만 공유되며, 이름과 설명은 Claude가 볼 수 없고 메모리는 프로젝트별로 나뉘는 구조를 보여 줍니다.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b7fb5"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH07 · 1/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">Claude 프로젝트의 구성과 작동 원리</text>
<text x="64" y="172" font-size="26" fill="#566273">프로젝트: 자체 대화 기록과 지식자료를 가진 독립된 작업 공간 (공식 문서 S7·S8)</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- Project container -->
<rect x="64" y="226" width="1000" height="620" rx="12" fill="#f1f5fb" stroke="#5b7fb5" stroke-width="2"/>
