<text x="1316" y="356" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">프로젝트 설명</text>
<text x="1316" y="408" font-size="26" fill="#1f2a37" text-anchor="middle">→ 목적과 규칙은</text>
<text x="1316" y="446" font-size="26" fill="#1f2a37" text-anchor="middle">지침에 쓴다 (저자 해석)</text>

<!-- Right column: memory -->
<rect x="1096" y="508" width="440" height="338" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1316" y="554" font-size="30" font-weight="bold" fill="#14253d" text-anchor="middle">메모리</text>
<text x="1124" y="600" font-size="26" fill="#2f6f73">✓ 이 프로젝트의 메모리</text>
