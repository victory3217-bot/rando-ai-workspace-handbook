<rect x="96" y="284" width="936" height="96" rx="12" fill="#14253d"/>
<text x="564" y="322" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">프로젝트 지침</text>
<text x="564" y="360" font-size="26" fill="#ffffff" text-anchor="middle">모든 대화에 적용되는 Claude에 대한 지시</text>

<rect x="96" y="394" width="936" height="96" rx="12" fill="#2f5d9b"/>
<text x="564" y="432" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">프로젝트 지식</text>
<text x="564" y="470" font-size="26" fill="#ffffff" text-anchor="middle">올려 둔 자료 · 프로젝트의 모든 대화에서 쓰임</text>

<line x1="250" y1="490" x2="250" y2="528" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ah)"/>
<line x1="564" y1="490" x2="564" y2="528" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ah)"/>
<line x1="878" y1="490" x2="878" y2="528" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ah)"/>

<rect x="96" y="532" width="308" height="150" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="250" y="576" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">대화 1</text>
<text x="250" y="618" font-size="24" fill="#1f2a37" text-anchor="middle">채팅에 올린 파일</text>
<text x="250" y="654" font-size="24" fill="#566273" text-anchor="middle">→ 이 대화에서만</text>

<rect x="410" y="532" width="308" height="150" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="564" y="576" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">대화 2</text>
<text x="564" y="618" font-size="24" fill="#1f2a37" text-anchor="middle">채팅에 올린 파일</text>
<text x="564" y="654" font-size="24" fill="#566273" text-anchor="middle">→ 이 대화에서만</text>

<rect x="724" y="532" width="308" height="150" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="878" y="576" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">대화 3</text>
<text x="878" y="618" font-size="24" fill="#1f2a37" text-anchor="middle">채팅에 올린 파일</text>
<text x="878" y="654" font-size="24" fill="#566273" text-anchor="middle">→ 이 대화에서만</text>

<rect x="96" y="704" width="936" height="118" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
<text x="564" y="752" font-size="27" font-weight="bold" fill="#14253d" text-anchor="middle">대화끼리 맥락은 공유되지 않음</text>
<text x="564" y="794" font-size="26" fill="#1f2a37" text-anchor="middle">공유되는 것은 프로젝트 지식에 넣은 것뿐</text>

<!-- Right column: name/description -->
<rect x="1096" y="226" width="440" height="262" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
<text x="1316" y="272" font-size="30" font-weight="bold" fill="#b7791f" text-anchor="middle">Claude가 보지 못함</text>
