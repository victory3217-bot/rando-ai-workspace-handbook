<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">AI 워크스페이스의 다섯 가지 구성요소</title>
<desc id="d">이 책이 AI 워크스페이스를 나누는 다섯 구성요소의 역할과 비유를 보여 주고, ②와 ③은 내 컴퓨터 밖에 있으며 ④와 ⑤는 보통 ①이나 ② 안의 정해진 폴더라는 점을 묶어 표시한다.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH02 · 1/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">AI 워크스페이스의 다섯 가지 구성요소</text>
<text x="64" y="172" font-size="26" fill="#566273">저자 해석 · 교육을 위한 저자의 분류이며 표준이 아님</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- column headings -->
<text x="84" y="246" font-size="24" font-weight="bold" fill="#566273">구성요소</text>
<text x="520" y="246" font-size="24" font-weight="bold" fill="#566273">하는 일 (한 줄 설명)</text>
<text x="1186" y="246" font-size="24" font-weight="bold" fill="#566273" text-anchor="middle">비유</text>

<!-- row 1 -->
<rect x="64" y="262" width="420" height="104" rx="12" fill="#14253d"/>
<text x="88" y="324" font-size="30" font-weight="bold" fill="#ffffff">① PC와 로컬 파일</text>
<rect x="500" y="262" width="540" height="104" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="524" y="323" font-size="26" fill="#1f2a37">내 컴퓨터 안의 폴더와 파일</text>
<rect x="1056" y="262" width="260" height="104" rx="12" fill="#e6eef9"/>
<text x="1186" y="323" font-size="26" fill="#1f2a37" text-anchor="middle">내 책상 서랍</text>

<!-- row 2 -->
<rect x="64" y="378" width="420" height="104" rx="12" fill="#14253d"/>
<text x="88" y="440" font-size="30" font-weight="bold" fill="#ffffff">② 클라우드 저장소</text>
<rect x="500" y="378" width="540" height="104" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="524" y="421" font-size="26" fill="#1f2a37">인터넷 서버에 파일을 보관하고</text>
<text x="524" y="457" font-size="26" fill="#1f2a37">여러 기기에서 쓰게 해 주는 서비스</text>
<rect x="1056" y="378" width="260" height="104" rx="12" fill="#e6eef9"/>
<text x="1186" y="439" font-size="26" fill="#1f2a37" text-anchor="middle">공용 캐비닛</text>

<!-- row 3 -->
<rect x="64" y="494" width="420" height="104" rx="12" fill="#14253d"/>
<text x="88" y="556" font-size="30" font-weight="bold" fill="#ffffff">③ AI 작업환경</text>
<rect x="500" y="494" width="540" height="104" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="524" y="537" font-size="26" fill="#1f2a37">내가 쓰는 AI 서비스와</text>
<text x="524" y="573" font-size="26" fill="#1f2a37">그 안의 설정, 대화, 프로젝트</text>
<rect x="1056" y="494" width="260" height="104" rx="12" fill="#e6eef9"/>
<text x="1186" y="537" font-size="26" fill="#1f2a37" text-anchor="middle">일을 맡기는</text>
<text x="1186" y="573" font-size="26" fill="#1f2a37" text-anchor="middle">담당자</text>

<!-- row 4 -->
<rect x="64" y="610" width="420" height="104" rx="12" fill="#2f5d9b"/>
<text x="88" y="672" font-size="29" font-weight="bold" fill="#ffffff">④ 업무문서와 지식베이스</text>
<rect x="500" y="610" width="540" height="104" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="524" y="653" font-size="26" fill="#1f2a37">업무 결과물, 참고자료, 자주 쓰는</text>
<text x="524" y="689" font-size="26" fill="#1f2a37">양식과 기준을 모아 둔 곳</text>
<rect x="1056" y="610" width="260" height="104" rx="12" fill="#e6eef9"/>
<text x="1186" y="671" font-size="26" fill="#1f2a37" text-anchor="middle">자료실</text>

<!-- row 5 -->
<rect x="64" y="726" width="420" height="104" rx="12" fill="#2f5d9b"/>
<text x="88" y="788" font-size="30" font-weight="bold" fill="#ffffff">⑤ 지침서와 확인 기록</text>
<rect x="500" y="726" width="540" height="104" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="524" y="769" font-size="26" fill="#1f2a37">AI에게 일을 시킬 때 따르는 규칙,</text>
<text x="524" y="805" font-size="26" fill="#1f2a37">결과를 확인한 기록</text>
<rect x="1056" y="726" width="260" height="104" rx="12" fill="#e6eef9"/>
<text x="1186" y="769" font-size="26" fill="#1f2a37" text-anchor="middle">업무 매뉴얼과</text>
<text x="1186" y="805" font-size="26" fill="#1f2a37" text-anchor="middle">결재 기록</text>

<!-- group: outside my computer (rows 2-3) -->
<rect x="1332" y="378" width="204" height="220" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="3"/>
<text x="1434" y="458" font-size="26" font-weight="bold" fill="#b7791f" text-anchor="middle">②와 ③은</text>
<text x="1434" y="498" font-size="26" font-weight="bold" fill="#1f2a37" text-anchor="middle">내 컴퓨터 밖</text>
<text x="1434" y="540" font-size="22" fill="#566273" text-anchor="middle">(CH01 2-3절)</text>

<!-- group: ④⑤ location (rows 4-5) -->
<rect x="1332" y="610" width="204" height="220" rx="12" fill="#f1f5fb" stroke="#2f5d9b" stroke-width="3"/>
<text x="1434" y="672" font-size="26" font-weight="bold" fill="#2f5d9b" text-anchor="middle">④⑤는 보통</text>
<text x="1434" y="712" font-size="26" fill="#1f2a37" text-anchor="middle">①이나 ② 안의</text>
<text x="1434" y="750" font-size="26" fill="#1f2a37" text-anchor="middle">정해진 폴더</text>
<text x="1434" y="790" font-size="24" fill="#566273" text-anchor="middle">(같은 폴더)</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
