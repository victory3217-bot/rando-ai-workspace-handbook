<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">지침서의 여덟 요소</title>
<desc id="d">업무 지침서의 여덟 절(목적과 범위, 입력자료 조건, 실행 단계, 결과물 형식, 금지사항, 예외 처리, 검증 기준, 수정 기록)을 문서 순서대로 놓고 각 절에 적을 핵심을 보여 준다.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH10 · 2/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">지침서의 여덟 요소</text>
<text x="64" y="172" font-size="26" fill="#566273">머리말(문서 번호 / 버전 / 갱신일 / 작성자 / 등급) 아래에 여덟 개의 절</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- 1 -->
<rect x="64" y="222" width="728" height="142" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="84" y="242" width="52" height="52" rx="12" fill="#14253d"/>
<text x="110" y="278" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="156" y="279" font-size="30" font-weight="bold" fill="#14253d">목적과 범위</text>
<text x="156" y="318" font-size="25" fill="#1f2a37">목적: CH01의 목적을 한 문장으로</text>
<text x="156" y="350" font-size="25" fill="#1f2a37">범위: 하는 일과 하지 않는 일을 나란히</text>

<!-- 2 -->
<rect x="64" y="376" width="728" height="142" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="84" y="396" width="52" height="52" rx="12" fill="#14253d"/>
<text x="110" y="432" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="156" y="433" font-size="30" font-weight="bold" fill="#14253d">입력자료 조건</text>
<text x="156" y="472" font-size="25" fill="#1f2a37">받는 자료: 이름, 형식, 등급</text>
<text x="156" y="504" font-size="25" fill="#1f2a37">받으면 안 되는 자료와 그때 할 일</text>

<!-- 3 -->
<rect x="64" y="530" width="728" height="142" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="84" y="550" width="52" height="52" rx="12" fill="#14253d"/>
<text x="110" y="586" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="156" y="587" font-size="30" font-weight="bold" fill="#14253d">실행 단계</text>
<text x="156" y="626" font-size="25" fill="#1f2a37">번호 순서로, 한 단계에 한 동작</text>
<text x="156" y="658" font-size="25" fill="#1f2a37">판단이 필요하면 판단 기준을 함께</text>

<!-- 4 -->
<rect x="64" y="684" width="728" height="142" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="84" y="704" width="52" height="52" rx="12" fill="#14253d"/>
<text x="110" y="740" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="156" y="741" font-size="30" font-weight="bold" fill="#14253d">결과물 형식</text>
<text x="156" y="780" font-size="25" fill="#1f2a37">표의 열, 필수 항목, 분량, 표시 규칙</text>
<text x="156" y="812" font-size="25" fill="#1f2a37">모르면 "확인 필요", 끝났다고 말할 조건</text>

<!-- 5 -->
<rect x="808" y="222" width="728" height="142" rx="12" fill="#ffffff" stroke="#a33a3a" stroke-width="2"/>
<rect x="828" y="242" width="52" height="52" rx="12" fill="#a33a3a"/>
<text x="854" y="278" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="900" y="279" font-size="30" font-weight="bold" fill="#14253d">금지사항</text>
<text x="900" y="318" font-size="25" fill="#1f2a37">메모에 없는 내용, 이름·금액·날짜 변경</text>
<text x="900" y="350" font-size="25" fill="#1f2a37">결정 대행, 외부 발송, 개인정보 처리 등</text>

<!-- 6 -->
<rect x="808" y="376" width="728" height="142" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
<rect x="828" y="396" width="52" height="52" rx="12" fill="#b7791f"/>
<text x="854" y="432" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="900" y="433" font-size="30" font-weight="bold" fill="#14253d">예외 처리</text>
<text x="900" y="472" font-size="25" fill="#1f2a37">"이런 상황이면 이렇게 한다"를 표로</text>
<text x="900" y="504" font-size="25" fill="#1f2a37">모르는 용어·규칙 충돌: 추측 말고 되묻기</text>

<!-- 7 -->
<rect x="808" y="530" width="728" height="142" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="828" y="550" width="52" height="52" rx="12" fill="#14253d"/>
<text x="854" y="586" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
<text x="900" y="587" font-size="30" font-weight="bold" fill="#14253d">검증 기준</text>
<text x="900" y="626" font-size="25" fill="#1f2a37">확인 방법: 사실 확인표, 숫자 재계산</text>
<text x="900" y="658" font-size="25" fill="#1f2a37">합격/불합격 조건 (예: 메모에 없는 내용 0개)</text>

<!-- 8 -->
<rect x="808" y="684" width="728" height="142" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="828" y="704" width="52" height="52" rx="12" fill="#14253d"/>
<text x="854" y="740" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
<text x="900" y="741" font-size="30" font-weight="bold" fill="#14253d">수정 기록</text>
<text x="900" y="780" font-size="25" fill="#1f2a37">버전, 날짜, 고친 내용, 이유, 시험 결과</text>
<text x="900" y="812" font-size="25" fill="#1f2a37">파일 이름에도 버전 (v01, v02)</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
