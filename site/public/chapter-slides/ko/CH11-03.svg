<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">사람의 승인 지점과 예외 처리</title>
<desc id="d">어떤 경우에 사람의 승인 지점을 두는지 다섯 가지 기준(저자의 제안)과 AI에게 넘기지 않는 원칙, 그리고 절차대로 되지 않는 여섯 가지 상황별 처리 방법을 보여 준다.</desc>
<defs>
<polygon id="ar" points="0,-10 18,0 0,10" fill="#5b7fb5"/>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH11 · 3/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">사람의 승인 지점과 예외 처리</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- left: approval point criteria -->
<rect x="64" y="222" width="636" height="78" rx="12" fill="#14253d"/>
<text x="90" y="256" font-size="28" font-weight="bold" fill="#ffffff">사람의 승인 지점으로 둘 곳</text>
<text x="90" y="288" font-size="22" fill="#ffffff">저자 해석 (저자의 제안)</text>

<rect x="64" y="312" width="636" height="76" rx="12" fill="#e6eef9"/>
<rect x="64" y="312" width="10" height="76" fill="#b7791f"/>
<text x="94" y="344" font-size="26" font-weight="bold" fill="#14253d">밖으로 나가는 것</text>
<text x="94" y="374" font-size="24" fill="#1f2a37">공유, 발송, 게시, 제출</text>
<rect x="64" y="396" width="636" height="76" rx="12" fill="#e6eef9"/>
<rect x="64" y="396" width="10" height="76" fill="#b7791f"/>
<text x="94" y="428" font-size="26" font-weight="bold" fill="#14253d">되돌리기 어려운 것</text>
<text x="94" y="458" font-size="24" fill="#1f2a37">삭제, 덮어쓰기, 금액이 걸린 결정</text>
<rect x="64" y="480" width="636" height="76" rx="12" fill="#e6eef9"/>
<rect x="64" y="480" width="10" height="76" fill="#b7791f"/>
<text x="94" y="512" font-size="26" font-weight="bold" fill="#14253d">판단과 책임이 필요한 것</text>
<text x="94" y="542" font-size="24" fill="#1f2a37">누가 무엇을 맡을지, 사실 여부</text>
<rect x="64" y="564" width="636" height="76" rx="12" fill="#e6eef9"/>
<rect x="64" y="564" width="10" height="76" fill="#b7791f"/>
<text x="94" y="596" font-size="26" font-weight="bold" fill="#14253d">자료를 AI에 넣기 전</text>
<text x="94" y="626" font-size="24" fill="#1f2a37">등급(CH03) 확인, 가림 상태</text>
<rect x="64" y="648" width="636" height="76" rx="12" fill="#e6eef9"/>
<rect x="64" y="648" width="10" height="76" fill="#b7791f"/>
<text x="94" y="680" font-size="26" font-weight="bold" fill="#14253d">AI가 확신이 없을 때</text>
<text x="94" y="710" font-size="24" fill="#1f2a37">또는 규칙을 어긴 흔적이 있을 때</text>

<rect x="64" y="738" width="636" height="108" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="3"/>
<text x="90" y="772" font-size="26" font-weight="bold" fill="#2f6f73">이 지점들을 AI에게 넘기지 않는다</text>
<text x="90" y="806" font-size="24" fill="#1f2a37">AI는 지침대로 하고,</text>
<text x="90" y="836" font-size="24" fill="#1f2a37">모르면 보고한다</text>

<!-- right: exceptions -->
<rect x="740" y="222" width="796" height="78" rx="12" fill="#2f5d9b"/>
<text x="766" y="256" font-size="28" font-weight="bold" fill="#ffffff">예외 처리</text>
<text x="766" y="288" font-size="22" fill="#ffffff">정해진 절차대로 되지 않는 상황 → 해야 할 일</text>

<rect x="740" y="312" width="320" height="82" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="762" y="346" font-size="24" fill="#1f2a37">입력자료가 비었거나</text>
<text x="762" y="378" font-size="24" fill="#1f2a37">형식이 다르다</text>
<use href="#ar" x="1064" y="353"/>
<rect x="1088" y="312" width="448" height="82" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1110" y="346" font-size="24" fill="#1f2a37">시작하지 않고</text>
<text x="1110" y="378" font-size="24" fill="#1f2a37">입력 보완을 요청한다</text>

<rect x="740" y="402" width="320" height="82" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="762" y="436" font-size="24" fill="#1f2a37">자료에 개인정보·</text>
<text x="762" y="468" font-size="24" fill="#1f2a37">비밀번호가 보인다</text>
<use href="#ar" x="1064" y="443"/>
<rect x="1088" y="402" width="448" height="82" rx="12" fill="#ffffff" stroke="#a33a3a" stroke-width="3"/>
<text x="1110" y="436" font-size="24" font-weight="bold" fill="#a33a3a">중단, 담당자에게 알리고</text>
<text x="1110" y="468" font-size="24" fill="#1f2a37">대화를 삭제한다 (CH03)</text>

<rect x="740" y="492" width="320" height="82" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="762" y="526" font-size="24" fill="#1f2a37">AI가 지침서 규칙을</text>
<text x="762" y="558" font-size="24" fill="#1f2a37">어긴 결과를 냈다</text>
<use href="#ar" x="1064" y="533"/>
<rect x="1088" y="492" width="448" height="82" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1110" y="526" font-size="24" fill="#1f2a37">결과를 폐기하거나 고쳐 쓰고</text>
<text x="1110" y="558" font-size="24" fill="#1f2a37">어긴 규칙을 개선 사항에 적는다</text>

<rect x="740" y="582" width="320" height="82" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="762" y="616" font-size="24" fill="#1f2a37">숫자나 인용이</text>
<text x="762" y="648" font-size="24" fill="#1f2a37">원문과 다르다</text>
<use href="#ar" x="1064" y="623"/>
<rect x="1088" y="582" width="448" height="82" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1110" y="616" font-size="24" fill="#1f2a37">사실 확인표대로 고친다</text>
<text x="1110" y="648" font-size="24" fill="#1f2a37">못 고치면 “확인 필요”로 남긴다</text>

<rect x="740" y="672" width="320" height="82" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="762" y="706" font-size="24" fill="#1f2a37">AI 서비스가 안 되거나</text>
<text x="762" y="738" font-size="24" fill="#1f2a37">한도에 걸렸다</text>
<use href="#ar" x="1064" y="713"/>
<rect x="1088" y="672" width="448" height="82" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1110" y="706" font-size="24" fill="#1f2a37">사람이 지침서로 직접 하거나</text>
<text x="1110" y="738" font-size="24" fill="#1f2a37">다음 날로 (기한 있으면 알림)</text>

<rect x="740" y="762" width="320" height="82" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="762" y="796" font-size="24" fill="#1f2a37">승인자가 없거나</text>
<text x="762" y="828" font-size="24" fill="#1f2a37">승인이 늦어진다</text>
<use href="#ar" x="1064" y="803"/>
<rect x="1088" y="762" width="448" height="82" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="3"/>
<text x="1110" y="796" font-size="24" font-weight="bold" fill="#b7791f">공유하지 않고 대기한다</text>
<text x="1110" y="828" font-size="24" fill="#1f2a37">급하면 상급자에게 확인한다</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
