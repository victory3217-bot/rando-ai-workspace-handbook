<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">CH06 프로젝트 메모리와 대화</title>
<desc id="d">프로젝트 전용 메모리와 기본 메모리가 무엇을 참조하는지 비교하고, 일반 대화 옮기기와 임시 채팅의 규칙, 처음 쓰는 학습자를 위한 저자 해석을 정리한다.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH06 · 2/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">메모리: 프로젝트 대화는 무엇을 참조하는가</text>
<text x="64" y="172" font-size="26" fill="#566273">만들 때 고르고 Project settings의 Memory에서 바꿈 · 적용까지 몇 시간 걸릴 수 있음 [S6]</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- header row -->
<rect x="64" y="226" width="440" height="66" rx="12" fill="#e6eef9"/>
<text x="284" y="269" font-size="26" font-weight="bold" fill="#566273" text-anchor="middle">참조 대상</text>
<rect x="516" y="226" width="440" height="66" rx="12" fill="#14253d"/>
<text x="736" y="270" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">프로젝트 전용 메모리</text>
<rect x="968" y="226" width="568" height="66" rx="12" fill="#2f5d9b"/>
<text x="1252" y="270" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">기본 메모리</text>

<!-- rows -->
<rect x="64" y="302" width="440" height="88" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="92" y="355" font-size="26" fill="#1f2a37">이전에 저장한 메모리</text>
<rect x="64" y="400" width="440" height="88" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="92" y="453" font-size="26" fill="#1f2a37">같은 프로젝트의 다른 대화</text>
<rect x="64" y="498" width="440" height="88" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="92" y="551" font-size="26" fill="#1f2a37">프로젝트 밖 대화</text>

<rect x="516" y="302" width="440" height="88" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="736" y="356" font-size="28" font-weight="bold" fill="#566273" text-anchor="middle">참조하지 않음</text>
<rect x="516" y="400" width="440" height="88" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="3"/>
<text x="736" y="454" font-size="28" font-weight="bold" fill="#2f6f73" text-anchor="middle">참조할 수 있음</text>
<rect x="516" y="498" width="440" height="88" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="736" y="552" font-size="28" font-weight="bold" fill="#566273" text-anchor="middle">참조하지 못함</text>

<rect x="968" y="302" width="568" height="284" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1252" y="346" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">요금제와 설정에 따라 다름</text>
<rect x="996" y="368" width="512" height="96" rx="12" fill="#f1f5fb"/>
<text x="1020" y="404" font-size="26" font-weight="bold" fill="#2f5d9b">Business 등</text>
<text x="1020" y="442" font-size="26" fill="#1f2a37">프로젝트 밖 대화와 서로 참조될 수 있음</text>
<rect x="996" y="474" width="512" height="96" rx="12" fill="#f1f5fb"/>
<text x="1020" y="510" font-size="26" font-weight="bold" fill="#2f5d9b">Enterprise · Edu</text>
<text x="1020" y="548" font-size="26" fill="#1f2a37">프로젝트 안에 머묾</text>

<!-- bottom notes -->
<rect x="64" y="610" width="476" height="236" rx="12" fill="#e6eef9"/>
<text x="92" y="652" font-size="28" font-weight="bold" fill="#14253d">일반 대화를 옮기면</text>
<text x="92" y="700" font-size="26" fill="#1f2a37">프로젝트로 옮긴 대화는</text>
<text x="92" y="738" font-size="26" fill="#1f2a37">프로젝트의 지침과</text>
<text x="92" y="776" font-size="26" fill="#1f2a37">파일 맥락을 이어받음</text>

<rect x="556" y="610" width="476" height="236" rx="12" fill="#e6eef9"/>
<text x="584" y="652" font-size="28" font-weight="bold" fill="#14253d">임시 채팅</text>
<text x="584" y="700" font-size="26" font-weight="bold" fill="#a33a3a">프로젝트에 추가할 수 없음</text>
<text x="584" y="738" font-size="26" fill="#1f2a37">저장하면 일반 채팅이 되어</text>
<text x="584" y="776" font-size="26" fill="#1f2a37">계정 설정을 따름</text>

<rect x="1048" y="610" width="488" height="236" rx="12" fill="#f1f5fb" stroke="#5b7fb5" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1076" y="652" font-size="28" font-weight="bold" fill="#2f5d9b">저자 해석</text>
<text x="1076" y="696" font-size="24" font-weight="bold" fill="#2f6f73">처음엔 프로젝트 전용 메모리 권장</text>
<text x="1076" y="730" font-size="24" fill="#1f2a37">가상 자료가 다른 대화와 섞이지 않아</text>
<text x="1076" y="764" font-size="24" fill="#1f2a37">결과를 해석하기 쉬움</text>
<text x="1076" y="798" font-size="24" fill="#566273">공식 문서는 어느 쪽도 권하지 않음</text>
<text x="1076" y="832" font-size="24" fill="#566273">메모리 ≠ 데이터 학습 설정(CH03)</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
