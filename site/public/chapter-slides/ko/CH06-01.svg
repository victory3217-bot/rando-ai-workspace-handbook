<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">CH06 프로젝트의 구성</title>
<desc id="d">일반 대화와 비교해, ChatGPT 프로젝트가 대화·프로젝트 소스·프로젝트 지침을 한곳에 묶는 구조와 요금제별 파일 수, 그리고 CH02 구성도와의 대응(저자 해석)을 보여 준다.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9b"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH06 · 1/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">프로젝트: 업무 하나를 한곳에 묶는 작업환경</text>
<text x="64" y="172" font-size="26" fill="#566273">공식 문서 확인 [S6], 확인일 2026-10-26 · 요금제와 워크스페이스 설정에 따라 다름</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

