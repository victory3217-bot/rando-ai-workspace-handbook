<text x="92" y="330" font-size="26" fill="#1f2a37">한 번의 대화로 끝나기 쉬움</text>
<text x="92" y="378" font-size="26" fill="#1f2a37">어떤 파일을 줬는지,</text>
<text x="92" y="414" font-size="26" fill="#1f2a37">어떤 지시를 했는지</text>
<text x="92" y="462" font-size="26" font-weight="bold" fill="#a33a3a">매번 다시 말해야 함</text>

<line x1="508" y1="365" x2="578" y2="365" stroke="#2f5d9b" stroke-width="5" marker-end="url(#ar)"/>

<!-- author interpretation -->
<rect x="64" y="530" width="440" height="285" rx="12" fill="#f1f5fb" stroke="#5b7fb5" stroke-width="2" stroke-dasharray="8 6"/>
<text x="92" y="576" font-size="26" font-weight="bold" fill="#2f5d9b">저자 해석 · CH02 구성도로 보면</text>
<text x="92" y="626" font-size="26" fill="#1f2a37">③ AI 작업환경 안에</text>
<text x="92" y="664" font-size="26" fill="#1f2a37">④ 업무문서와 ⑤ 지침서를</text>
<text x="92" y="702" font-size="26" fill="#1f2a37">넣어 두는 자리</text>
<text x="92" y="770" font-size="24" fill="#566273">공식 문서의 표현이 아님</text>

