<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">AI Workflow란 무엇인가</title>
<desc id="d">업무 절차(순서)에 누가, 입력, 출력, 확인, 예외 처리를 더한 것이 AI Workflow라는 이 책의 작업 정의와, CH10 지침서 및 하네스와의 관계를 보여 준다.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH11 · 1/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">AI Workflow란 무엇인가</text>
<text x="64" y="172" font-size="26" fill="#566273">업무 절차(순서)에 다섯 요소를 더한 설계 (이 책의 작업 정의)</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- left: layered build-up -->
<rect x="64" y="222" width="696" height="68" rx="12" fill="#14253d"/>
<text x="90" y="268" font-size="32" font-weight="bold" fill="#ffffff">AI Workflow</text>
<text x="734" y="266" font-size="24" fill="#ffffff" text-anchor="end">이 책의 작업 정의</text>

<rect x="64" y="302" width="696" height="50" rx="12" fill="#e6eef9"/>
<text x="90" y="336" font-size="26" font-weight="bold" fill="#2f5d9b">+ 누가</text>
<text x="400" y="336" font-size="26" fill="#1f2a37">단계마다 사람 또는 AI</text>
<rect x="64" y="362" width="696" height="50" rx="12" fill="#e6eef9"/>
<text x="90" y="396" font-size="26" font-weight="bold" fill="#2f5d9b">+ 무엇을 받아</text>
<text x="400" y="396" font-size="26" fill="#1f2a37">각 단계의 입력</text>
<rect x="64" y="422" width="696" height="50" rx="12" fill="#e6eef9"/>
<text x="90" y="456" font-size="26" font-weight="bold" fill="#2f5d9b">+ 무엇을 내고</text>
<text x="400" y="456" font-size="26" fill="#1f2a37">각 단계의 출력</text>
<rect x="64" y="482" width="696" height="50" rx="12" fill="#e6eef9"/>
<text x="90" y="516" font-size="26" font-weight="bold" fill="#2f5d9b">+ 어떻게 확인</text>
<text x="400" y="516" font-size="26" fill="#1f2a37">확인(검증)</text>
<rect x="64" y="542" width="696" height="50" rx="12" fill="#e6eef9"/>
<text x="90" y="576" font-size="26" font-weight="bold" fill="#2f5d9b">+ 안 되면</text>
<text x="400" y="576" font-size="26" fill="#1f2a37">예외 처리</text>

<rect x="64" y="604" width="696" height="60" rx="12" fill="#f1f5fb" stroke="#5b7fb5" stroke-width="2"/>
<text x="412" y="643" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">업무 절차 = 일의 순서</text>

<rect x="64" y="682" width="696" height="164" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="90" y="724" font-size="26" font-weight="bold" fill="#14253d">CH10 지침서 → CH11 Workflow</text>
<text x="90" y="766" font-size="24" fill="#1f2a37">지침서: AI가 따를 규칙</text>
<text x="90" y="806" font-size="24" fill="#1f2a37">Workflow: 그 규칙을 일의 흐름 속에 놓는 설계</text>

<!-- right: workflow vs harness -->
<text x="800" y="242" font-size="26" font-weight="bold" fill="#14253d">단순 Workflow와 하네스</text>
<rect x="800" y="258" width="358" height="60" rx="12" fill="#14253d"/>
<text x="979" y="297" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">단순 Workflow</text>
<rect x="1178" y="258" width="358" height="60" rx="12" fill="#2f5d9b"/>
<text x="1357" y="297" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">하네스</text>

<rect x="800" y="330" width="358" height="120" rx="12" fill="#e6eef9"/>
<text x="822" y="372" font-size="24" fill="#1f2a37">단계, 담당, 승인,</text>
<text x="822" y="404" font-size="24" fill="#1f2a37">예외의 설계</text>
<rect x="1178" y="330" width="358" height="120" rx="12" fill="#e6eef9"/>
<text x="1200" y="372" font-size="24" fill="#1f2a37">AI의 수행을 지원하고</text>
<text x="1200" y="404" font-size="24" fill="#1f2a37">통제하는 실행 체계</text>

<rect x="800" y="462" width="358" height="140" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="822" y="500" font-size="24" fill="#1f2a37">종이, 문서,</text>
<text x="822" y="532" font-size="24" fill="#1f2a37">글자 도표로 만든다</text>
<rect x="1178" y="462" width="358" height="140" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="1200" y="500" font-size="24" fill="#1f2a37">문서뿐 아니라</text>
<text x="1200" y="532" font-size="24" fill="#1f2a37">규칙을 AI에게 매번</text>
<text x="1200" y="564" font-size="24" fill="#1f2a37">적용하게 하는 구성이</text>
<text x="1200" y="594" font-size="24" fill="#1f2a37">더해질 수 있음</text>

<rect x="800" y="614" width="358" height="56" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="2"/>
<text x="979" y="651" font-size="24" font-weight="bold" fill="#2f6f73" text-anchor="middle">CH11 필수</text>
<rect x="1178" y="614" width="358" height="56" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1357" y="651" font-size="24" font-weight="bold" fill="#566273" text-anchor="middle">선택·심화 과정</text>

<rect x="800" y="684" width="736" height="162" rx="12" fill="#e6eef9"/>
<text x="822" y="722" font-size="24" font-weight="bold" fill="#14253d">저자 해석 (업계 표준이라고 단정하지 않음)</text>
<text x="822" y="758" font-size="24" fill="#1f2a37">워크스페이스·Workflow·하네스는 배타적 분류가 아님</text>
<text x="822" y="794" font-size="24" fill="#1f2a37">하네스는 Workflow의 단계를 활용할 수 있음</text>
<text x="822" y="830" font-size="24" fill="#1f2a37">Workflow는 하네스 안에 들어갈 수 있음</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
