<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">CH06 프로젝트와 데이터</title>
<desc id="d">프로젝트에 넣은 자료도 CH03의 등급과 규정을 따른다는 원칙 아래, 계정 종류별 모델 학습 사용 여부, 파일 공유·외부 연결·삭제 규칙, 이 장에서 정한 네 가지 판단을 정리한다.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH06 · 3/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">프로젝트와 데이터: 이름이 안전을 만들지 않는다</text>
<text x="64" y="172" font-size="26" fill="#566273">공식 문서 확인 [S6]·[S1]·[S2], 확인일 2026-10-26 · 맨 아래 띠는 저자의 판단</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<rect x="64" y="214" width="1472" height="64" rx="12" fill="#14253d"/>
<text x="800" y="256" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">프로젝트에 올린 파일과 대화도 CH03에서 정한 등급과 규정을 그대로 따른다</text>

<text x="64" y="316" font-size="26" font-weight="bold" fill="#14253d">모델 학습에 쓰이는가</text>
<text x="960" y="316" font-size="26" font-weight="bold" fill="#14253d">공유 · 연결 · 삭제</text>

<!-- training rows -->
<rect x="64" y="330" width="240" height="116" rx="12" fill="#2f5d9b"/>
<text x="184" y="397" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Free · Plus · Pro</text>
<rect x="316" y="330" width="624" height="116" rx="12" fill="#e6eef9"/>
<text x="340" y="376" font-size="24" fill="#1f2a37">Improve the model for everyone 설정이 켜져 있으면</text>
<text x="340" y="412" font-size="24" font-weight="bold" fill="#a33a3a">프로젝트에서 접근한 정보를 학습에 쓸 수 있음</text>

<rect x="64" y="456" width="240" height="116" rx="12" fill="#2f5d9b"/>
<text x="184" y="508" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">공유한 프로젝트</text>
<text x="184" y="542" font-size="24" fill="#ffffff" text-anchor="middle">(개인 계정)</text>
<rect x="316" y="456" width="624" height="116" rx="12" fill="#e6eef9"/>
<text x="340" y="502" font-size="24" fill="#1f2a37">프로젝트 소유자와 모든 참여자가 이 설정을</text>
<text x="340" y="538" font-size="24" fill="#1f2a37">켠 경우에만 모델 개선에 쓰일 수 있음</text>

<rect x="64" y="582" width="240" height="118" rx="12" fill="#2f5d9b"/>
<text x="184" y="632" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Business ·</text>
<text x="184" y="666" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Enterprise · Edu</text>
<rect x="316" y="582" width="624" height="118" rx="12" fill="#e6eef9"/>
<text x="340" y="628" font-size="24" fill="#1f2a37">기본적으로 워크스페이스 데이터를</text>
<text x="340" y="664" font-size="24" font-weight="bold" fill="#2f6f73">모델 학습에 쓰지 않음</text>

<!-- sharing / connection / deletion -->
<rect x="960" y="330" width="576" height="86" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="986" y="364" font-size="26" font-weight="bold" fill="#14253d">프로젝트 파일</text>
<text x="986" y="400" font-size="24" fill="#1f2a37">소유자뿐 아니라 모든 구성원이 보고 내려받음</text>

<rect x="960" y="426" width="576" height="86" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="986" y="460" font-size="26" font-weight="bold" fill="#14253d">Google Drive · Slack 링크를 소스로</text>
<text x="986" y="496" font-size="24" fill="#b7791f">연결할 때 접근을 승인해야 함</text>

<rect x="960" y="522" width="576" height="178" rx="12" fill="#ffffff" stroke="#a33a3a" stroke-width="2"/>
<text x="986" y="558" font-size="26" font-weight="bold" fill="#a33a3a">프로젝트 삭제: 되돌릴 수 없음</text>
<text x="986" y="592" font-size="24" fill="#1f2a37">대화·지침·프로젝트에만 저장된 파일이</text>
<text x="986" y="624" font-size="24" fill="#1f2a37">영구히 제거됨</text>
<text x="986" y="656" font-size="24" fill="#1f2a37">30일 안에 OpenAI 시스템에서 제거</text>
<text x="986" y="688" font-size="24" fill="#566273">(법적·보안상 보관이 필요한 경우 제외)</text>

<!-- author's decisions -->
<rect x="64" y="716" width="240" height="118" rx="12" fill="#2f6f73"/>
<text x="184" y="766" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">이 장에서</text>
<text x="184" y="800" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">정하는 것</text>
<rect x="316" y="716" width="240" height="118" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="2"/>
<text x="340" y="766" font-size="24" font-weight="bold" fill="#2f6f73">① 프로젝트를</text>
<text x="340" y="800" font-size="24" fill="#1f2a37">공유하지 않음</text>
<rect x="568" y="716" width="300" height="118" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="2"/>
<text x="592" y="766" font-size="24" font-weight="bold" fill="#2f6f73">② 앱·Google Drive 등</text>
<text x="592" y="800" font-size="24" fill="#1f2a37">외부 연결 켜지 않음</text>
<rect x="880" y="716" width="240" height="118" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="2"/>
<text x="904" y="766" font-size="24" font-weight="bold" fill="#2f6f73">③ 가상자료만</text>
<text x="904" y="800" font-size="24" fill="#1f2a37">올림</text>
<rect x="1132" y="716" width="404" height="118" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="2"/>
<text x="1156" y="766" font-size="24" font-weight="bold" fill="#2f6f73">④ 프로젝트 이름·지침에</text>
<text x="1156" y="800" font-size="24" fill="#1f2a37">개인정보·비밀번호·API 키 없음</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
