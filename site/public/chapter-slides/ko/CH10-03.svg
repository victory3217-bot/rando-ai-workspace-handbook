<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">시험하고 고쳐서 새 버전으로</title>
<desc id="d">지침서를 작성하고 가상 사례로 시험한 뒤 기대 행동과 실제 결과를 비교해 개선 사항 목록과 새 버전을 만드는 순환을 보여 주고, CH09 오류가 지침서의 어느 절로 옮겨지는지와 버전 관리 원칙을 함께 정리한다.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9b"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH10 · 3/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">시험하고 고쳐서 새 버전으로</text>
<text x="64" y="172" font-size="26" fill="#566273">시험은 AI 서비스로, 또는 사람이 지침서만 읽고 점검자가 되어 할 수 있다</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- cycle nodes -->
<rect x="64" y="226" width="460" height="170" rx="12" fill="#14253d"/>
<text x="294" y="276" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">① 지침서 작성 (v01)</text>
<text x="294" y="322" font-size="25" fill="#ffffff" text-anchor="middle">여덟 요소로 쓰기</text>
<text x="294" y="358" font-size="25" fill="#ffffff" text-anchor="middle">CH09 오류 유형을 규칙으로</text>

<rect x="590" y="226" width="460" height="170" rx="12" fill="#ffffff" stroke="#2f5d9b" stroke-width="2"/>
<text x="820" y="276" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">② 가상 사례로 시험</text>
<text x="820" y="322" font-size="25" fill="#1f2a37" text-anchor="middle">T1 정상 · T2 정보 누락</text>
<text x="820" y="358" font-size="25" fill="#1f2a37" text-anchor="middle">T3 범위 밖 요청</text>

<rect x="590" y="650" width="460" height="170" rx="12" fill="#ffffff" stroke="#2f5d9b" stroke-width="2"/>
<text x="820" y="700" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">③ 기대 행동 vs 실제 결과</text>
<text x="820" y="746" font-size="25" fill="#1f2a37" text-anchor="middle">합격/불합격 기록</text>
<text x="820" y="782" font-size="25" fill="#1f2a37" text-anchor="middle">모호한 문장 찾기</text>

<rect x="64" y="650" width="460" height="170" rx="12" fill="#e6eef9" stroke="#2f5d9b" stroke-width="2"/>
<text x="294" y="700" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">④ 개선 사항 목록 → v02</text>
<text x="294" y="746" font-size="25" fill="#1f2a37" text-anchor="middle">한 번에 하나씩 고치기</text>
<text x="294" y="782" font-size="25" fill="#1f2a37" text-anchor="middle">이유·날짜·시험 결과 기록</text>

<!-- arrows -->
<line x1="528" y1="311" x2="584" y2="311" stroke="#2f5d9b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="820" y1="400" x2="820" y2="644" stroke="#2f5d9b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="586" y1="735" x2="530" y2="735" stroke="#2f5d9b" stroke-width="4" marker-end="url(#ah)"/>
<line x1="294" y1="646" x2="294" y2="402" stroke="#2f5d9b" stroke-width="4" marker-end="url(#ah)"/>

<!-- centre rule -->
<rect x="330" y="462" width="454" height="122" rx="12" fill="#f1f5fb" stroke="#2f6f73" stroke-width="2"/>
<text x="557" y="511" font-size="27" font-weight="bold" fill="#2f6f73" text-anchor="middle">개선이 확인된 뒤</text>
<text x="557" y="551" font-size="26" fill="#1f2a37" text-anchor="middle">새 버전을 확정</text>

<!-- right panel: errors to rules -->
<rect x="1080" y="222" width="456" height="360" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1102" y="258" font-size="26" font-weight="bold" fill="#14253d">CH09 오류에서 규칙으로</text>
<text x="1102" y="288" font-size="22" fill="#566273">가상 사례 (3절)</text>
<text x="1102" y="328" font-size="24" fill="#1f2a37">지어낸 인용</text>
<text x="1102" y="360" font-size="24" font-weight="bold" fill="#a33a3a">→ 금지사항</text>
<text x="1102" y="396" font-size="24" fill="#1f2a37">핵심 단어를 바꿈</text>
<text x="1102" y="428" font-size="24" font-weight="bold" fill="#a33a3a">→ 금지사항</text>
<text x="1102" y="464" font-size="24" fill="#1f2a37">담당자 없는 항목에 이름을 채움</text>
<text x="1102" y="496" font-size="24" font-weight="bold" fill="#b7791f">→ 예외 처리</text>
<text x="1102" y="532" font-size="24" fill="#1f2a37">미결 사항을 빠뜨림</text>
<text x="1102" y="564" font-size="24" font-weight="bold" fill="#2f5d9b">→ 검증 기준</text>

<!-- right panel: version rules -->
<rect x="1080" y="596" width="456" height="250" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1102" y="634" font-size="26" font-weight="bold" fill="#14253d">버전 관리</text>
<text x="1102" y="662" font-size="22" fill="#566273">저자의 제안</text>
<text x="1102" y="698" font-size="24" fill="#1f2a37">이전 버전은 90_보관에</text>
<text x="1102" y="730" font-size="24" fill="#1f2a37">AI 프로젝트 지침(CH06·CH07)도</text>
<text x="1102" y="762" font-size="24" fill="#1f2a37">같은 버전으로 바꾸기</text>
<text x="1102" y="794" font-size="24" fill="#566273">안 바꾸면 문서와 AI가 따르는</text>
<text x="1102" y="826" font-size="24" fill="#566273">규칙이 달라짐</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
