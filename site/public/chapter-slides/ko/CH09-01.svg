<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">AI 업무 요청문의 구조</title>
<desc id="d">AI 업무 요청문을 이루는 여섯 부분(목적, 입력자료, 할 일, 결과물 형식, 규칙, 확인 방법)과, 요청 전에 정의해 둘 입력자료와 기대 결과물을 보여 줍니다.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><polygon points="0,0 10,5 0,10" fill="#5b7fb5"/></marker>
</defs>
<text x="64" y="70" font-size="22" font-weight="700" fill="#2f5d9b">CH09 · 1/3</text>
<text x="64" y="128" font-size="46" font-weight="700" fill="#14253d">AI 업무 요청문의 구조</text>
<text x="64" y="172" font-size="26" fill="#566273">요청이 모호하면 결과도 모호해진다 — 여섯 부분을 갖춘다</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- left: input material -->
<rect x="64" y="300" width="350" height="300" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<rect x="64" y="300" width="350" height="60" rx="12" fill="#14253d"/>
<text x="239" y="340" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">입력자료 정의</text>
<text x="88" y="408" font-size="25" fill="#1f2a37">· 등급 확인 (CH03)</text>
<text x="88" y="456" font-size="25" fill="#1f2a37">· 어느 버전인가</text>
<text x="112" y="492" font-size="25" fill="#566273">(CH04 파일명 규칙)</text>
<text x="88" y="540" font-size="25" fill="#1f2a37">· 들어 있는 것과</text>
<text x="112" y="576" font-size="25" fill="#1f2a37">빠진 것</text>
<line x1="414" y1="430" x2="470" y2="430" stroke="#5b7fb5" stroke-width="4" marker-end="url(#ar)"/>

<!-- centre: request -->
<rect x="474" y="230" width="652" height="56" rx="12" fill="#14253d"/>
<text x="800" y="268" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">업무 요청문</text>

<rect x="474" y="300" width="652" height="80" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<rect x="490" y="312" width="280" height="56" rx="10" fill="#2f5d9b"/>
<text x="630" y="349" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">① 목적</text>
<text x="790" y="349" font-size="26" fill="#1f2a37">왜 이 일을 하나</text>

<rect x="474" y="390" width="652" height="80" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<rect x="490" y="402" width="280" height="56" rx="10" fill="#2f5d9b"/>
<text x="630" y="439" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">② 입력자료</text>
<text x="790" y="439" font-size="26" fill="#1f2a37">무엇을 주나, 등급</text>

<rect x="474" y="480" width="652" height="80" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<rect x="490" y="492" width="280" height="56" rx="10" fill="#2f5d9b"/>
<text x="630" y="529" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">③ 할 일</text>
<text x="790" y="529" font-size="26" fill="#1f2a37">해야 할 작업</text>

<rect x="474" y="570" width="652" height="80" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<rect x="490" y="582" width="280" height="56" rx="10" fill="#2f5d9b"/>
<text x="630" y="619" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">④ 결과물 형식</text>
<text x="790" y="619" font-size="26" fill="#1f2a37">모양, 항목, 길이</text>

<rect x="474" y="660" width="652" height="80" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<rect x="490" y="672" width="280" height="56" rx="10" fill="#2f5d9b"/>
<text x="630" y="709" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">⑤ 규칙</text>
<text x="790" y="709" font-size="26" fill="#1f2a37">하지 말 것, 모를 때</text>

<rect x="474" y="750" width="652" height="80" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<rect x="490" y="762" width="280" height="56" rx="10" fill="#2f5d9b"/>
<text x="630" y="799" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">⑥ 확인 방법</text>
<text x="790" y="799" font-size="26" fill="#1f2a37">사람이 무엇을 확인할지</text>

<!-- right: expected output -->
<line x1="1126" y1="610" x2="1182" y2="610" stroke="#5b7fb5" stroke-width="4" marker-end="url(#ar)"/>
<rect x="1186" y="380" width="350" height="460" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<rect x="1186" y="380" width="350" height="60" rx="12" fill="#14253d"/>
<text x="1361" y="420" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">기대 결과물 정의</text>
<text x="1210" y="488" font-size="25" fill="#1f2a37">· 누가 쓰나</text>
<text x="1210" y="530" font-size="25" fill="#1f2a37">· 반드시 필요한 항목</text>
<text x="1210" y="572" font-size="25" fill="#1f2a37">· 하지 않을 일</text>
<text x="1234" y="608" font-size="25" fill="#566273">(결정 대신하기,</text>
<text x="1234" y="644" font-size="25" fill="#566273">외부 발송 등)</text>
<rect x="1202" y="690" width="318" height="136" rx="12" fill="#e6eef9" stroke="#2f6f73" stroke-width="2"/>
<text x="1361" y="730" font-size="25" font-weight="700" fill="#14253d" text-anchor="middle">끝났다고 말할 조건을</text>
<text x="1361" y="766" font-size="25" font-weight="700" fill="#14253d" text-anchor="middle">먼저 적는다</text>
<text x="1361" y="802" font-size="25" fill="#2f6f73" text-anchor="middle">→ 검증이 쉬워짐</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
