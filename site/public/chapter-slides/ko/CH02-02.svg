<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">구성도 한 장: 다섯 칸은 이렇게 이어진다</title>
<desc id="d">다섯 구성요소 사이의 자료 이동을 화살표로 보여 주는 구성도이다. ①과 ②는 동기화하고, ①의 자료를 붙여 넣거나 올려야 ③이 읽으며, 결과는 내가 ①에 저장하고, ③은 ④와 ⑤에서 참고자료와 규칙을 받는다.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9b"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH02 · 2/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">구성도 한 장: 다섯 칸은 이렇게 이어진다</text>
<text x="64" y="172" font-size="26" fill="#566273">화살표는 자료가 이동하는 방향</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- ① -->
<rect x="64" y="236" width="560" height="200" rx="12" fill="#14253d"/>
<text x="344" y="300" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">① PC·로컬 파일</text>
<text x="344" y="350" font-size="26" fill="#ffffff" text-anchor="middle">원본이 있는 출발점</text>
<text x="344" y="392" font-size="26" fill="#ffffff" text-anchor="middle">사본: PC 안</text>

<!-- ② -->
<rect x="976" y="236" width="560" height="200" rx="12" fill="#2f5d9b"/>
<text x="1256" y="300" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">② 클라우드 저장소</text>
<text x="1256" y="350" font-size="26" fill="#ffffff" text-anchor="middle">①의 백업 · 기기 간 공유</text>
<text x="1256" y="392" font-size="26" fill="#ffffff" text-anchor="middle">사본: 서버 + 동기화된 기기</text>

<!-- sync arrow -->
<line x1="634" y1="336" x2="966" y2="336" stroke="#2f5d9b" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="800" y="318" font-size="28" font-weight="bold" fill="#2f5d9b" text-anchor="middle">동기화</text>

<!-- ③ -->
<rect x="64" y="610" width="560" height="220" rx="12" fill="#2f5d9b"/>
<text x="344" y="672" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">③ AI 작업환경</text>
<text x="344" y="720" font-size="26" fill="#ffffff" text-anchor="middle">내가 넣어 준 자료를 읽고 초안 작성</text>
<text x="344" y="762" font-size="26" fill="#ffffff" text-anchor="middle">사본: 대화 기록 등</text>
<text x="344" y="800" font-size="24" fill="#ffffff" text-anchor="middle">(서비스별로 다름, CH03)</text>

<!-- ① to ③ and back -->
<line x1="150" y1="446" x2="150" y2="600" stroke="#2f5d9b" stroke-width="4" marker-end="url(#ah)"/>
<text x="172" y="512" font-size="26" font-weight="bold" fill="#1f2a37">붙여넣기·</text>
<text x="172" y="548" font-size="26" font-weight="bold" fill="#1f2a37">업로드</text>
<line x1="560" y1="600" x2="560" y2="446" stroke="#2f5d9b" stroke-width="4" marker-end="url(#ah)"/>
<text x="582" y="512" font-size="26" font-weight="bold" fill="#1f2a37">결과를 복사해</text>
<text x="582" y="548" font-size="26" font-weight="bold" fill="#1f2a37">내가 ①에 저장</text>

<!-- ④⑤ -->
<rect x="976" y="520" width="560" height="310" rx="12" fill="#e6eef9" stroke="#2f5d9b" stroke-width="2"/>
<text x="1256" y="562" font-size="24" fill="#566273" text-anchor="middle">보통 ①이나 ② 안의 정해진 폴더</text>
<rect x="1000" y="584" width="512" height="110" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1256" y="628" font-size="30" font-weight="bold" fill="#14253d" text-anchor="middle">④ 지식베이스</text>
<text x="1256" y="670" font-size="26" fill="#1f2a37" text-anchor="middle">쓸 만한 결과물과 양식</text>
<rect x="1000" y="706" width="512" height="110" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1256" y="750" font-size="30" font-weight="bold" fill="#14253d" text-anchor="middle">⑤ 지침서·확인 기록</text>
<text x="1256" y="792" font-size="26" fill="#1f2a37" text-anchor="middle">③에게 줄 규칙 + 확인한 기록</text>

<!-- ④⑤ to ③ -->
<line x1="966" y1="720" x2="634" y2="720" stroke="#2f5d9b" stroke-width="4" marker-end="url(#ah)"/>
<text x="800" y="700" font-size="28" font-weight="bold" fill="#2f5d9b" text-anchor="middle">참고자료·규칙</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
