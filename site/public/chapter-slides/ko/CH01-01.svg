<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">AI 워크스페이스란 무엇인가</title>
<desc id="d">AI 서비스 하나(연필)는 입력한 글·파일·지시와 내가 제공한 자료로만 일하지만, 이 책의 AI 워크스페이스는 폴더, 클라우드 파일, AI 서비스, 업무 문서, 규칙을 합친 작업환경 전체이며 서비스의 'workspace' 용어와 다르다는 것을 보여 준다.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9b"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH01 · 1/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">AI 워크스페이스란 무엇인가</text>
<text x="64" y="172" font-size="26" fill="#566273">AI 서비스 하나가 아니라, AI와 함께 일하기 위한 작업환경 전체</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- Left: one AI service -->
<rect x="64" y="220" width="580" height="530" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<rect x="64" y="220" width="580" height="66" rx="12" fill="#2f5d9b"/>
<text x="354" y="264" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">AI 서비스 하나 = 연필 한 자루</text>
<rect x="92" y="306" width="524" height="56" rx="12" fill="#f1f5fb" stroke="#c9d4e5"/>
<text x="354" y="343" font-size="26" fill="#1f2a37" text-anchor="middle">입력한 글 · 파일 · 지시</text>
<line x1="354" y1="364" x2="354" y2="392" stroke="#2f5d9b" stroke-width="3" marker-end="url(#ah)"/>
<rect x="92" y="398" width="524" height="56" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="354" y="435" font-size="26" fill="#1f2a37" text-anchor="middle">새 글을 만들어 돌려준다</text>
<text x="92" y="500" font-size="26" font-weight="bold" fill="#14253d">AI가 쓰는 자료</text>
<rect x="92" y="516" width="524" height="52" rx="12" fill="#f1f5fb" stroke="#c9d4e5"/>
<text x="354" y="551" font-size="24" fill="#1f2a37" text-anchor="middle">일반 지식 (사전학습)</text>
<rect x="92" y="578" width="524" height="52" rx="12" fill="#f1f5fb" stroke="#c9d4e5"/>
<text x="354" y="613" font-size="24" fill="#1f2a37" text-anchor="middle">내가 제공하는 업무자료</text>
<rect x="92" y="646" width="524" height="88" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
<text x="354" y="680" font-size="24" fill="#1f2a37" text-anchor="middle">내 컴퓨터의 모든 업무파일을</text>
<text x="354" y="714" font-size="24" fill="#1f2a37" text-anchor="middle">자동으로 읽는 것은 아니다</text>

<!-- Middle -->
<text x="672" y="500" font-size="52" font-weight="bold" fill="#2f5d9b" text-anchor="middle">≠</text>

<!-- Right: AI Workspace -->
<rect x="700" y="220" width="836" height="530" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<rect x="700" y="220" width="836" height="66" rx="12" fill="#14253d"/>
<text x="1118" y="264" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">AI 워크스페이스 = 작업환경 전체</text>
<text x="1118" y="340" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">AI와 함께 업무를 수행하기 위한 작업환경</text>

<rect x="728" y="376" width="246" height="96" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="851" y="416" font-size="26" fill="#1f2a37" text-anchor="middle">내 컴퓨터의</text>
<text x="851" y="452" font-size="26" fill="#1f2a37" text-anchor="middle">폴더</text>
<rect x="995" y="376" width="246" height="96" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="1118" y="416" font-size="26" fill="#1f2a37" text-anchor="middle">클라우드에</text>
<text x="1118" y="452" font-size="26" fill="#1f2a37" text-anchor="middle">둔 파일</text>
<rect x="1262" y="376" width="246" height="96" rx="12" fill="#2f5d9b"/>
<text x="1385" y="416" font-size="26" fill="#ffffff" text-anchor="middle">쓰고 있는</text>
<text x="1385" y="452" font-size="26" fill="#ffffff" text-anchor="middle">AI 서비스</text>
<rect x="728" y="488" width="380" height="96" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="918" y="545" font-size="26" fill="#1f2a37" text-anchor="middle">업무 문서</text>
<rect x="1128" y="488" width="380" height="96" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="1318" y="528" font-size="26" fill="#1f2a37" text-anchor="middle">AI에게 일을 시킬 때</text>
<text x="1318" y="564" font-size="26" fill="#1f2a37" text-anchor="middle">따르는 규칙</text>

<rect x="728" y="600" width="780" height="134" rx="12" fill="#f1f5fb" stroke="#c9d4e5"/>
<text x="1118" y="632" font-size="22" fill="#566273" text-anchor="middle">저자 해석 · 책상 비유</text>
<text x="1118" y="670" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">만드는 것은 연필이 아니라 책상 · 서랍 · 정리 규칙</text>
<text x="1118" y="710" font-size="24" fill="#1f2a37" text-anchor="middle">성공 기준: 내 실제 업무 하나를 AI와 함께 끝낼 수 있는 환경</text>

<!-- Bottom: service term -->
<rect x="64" y="764" width="1472" height="84" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="96" y="797" font-size="24" fill="#1f2a37"><tspan font-weight="bold" fill="#14253d">서비스의 'workspace'와 다르다: </tspan>ChatGPT의 personal / Managed workspaces는 그 서비스가 정한 제품 용어</text>
<text x="96" y="832" font-size="24" fill="#1f2a37">이 책의 AI 워크스페이스는 내 업무환경 전체를 가리키는 교육용 개념(작업 정의)</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
