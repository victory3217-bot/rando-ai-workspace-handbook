<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="ko" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">저장·동기화·백업·버전 기록의 차이</title>
<desc id="d">저장, 동기화, 백업, 버전 기록을 하는 일, 지웠을 때, 잘못 고쳤을 때, 책임의 네 기준으로 비교하고, 동기화는 삭제도 퍼뜨리므로 백업이 아니라는 결론을 공식 문서 근거와 함께 보여 준다.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><polygon points="0,0 10,5 0,10" fill="#2f5d9b"/></marker>
</defs>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH13 · 1/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">저장 · 동기화 · 백업 · 버전 기록은 다르다</text>
<text x="64" y="172" font-size="26" fill="#566273">같은 '파일 보관'처럼 보여도, 지우거나 잘못 고쳤을 때 결과와 책임이 다르다</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- header row -->
<rect x="268" y="216" width="310" height="56" rx="12" fill="#14253d"/>
<text x="423" y="254" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">저장</text>
<rect x="586" y="216" width="310" height="56" rx="12" fill="#14253d"/>
<text x="741" y="254" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">동기화</text>
<rect x="904" y="216" width="310" height="56" rx="12" fill="#14253d"/>
<text x="1059" y="254" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">백업</text>
<rect x="1222" y="216" width="310" height="56" rx="12" fill="#14253d"/>
<text x="1377" y="254" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">버전 기록</text>

<!-- row labels -->
<rect x="64" y="280" width="196" height="84" rx="12" fill="#e6eef9"/>
<text x="162" y="330" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">하는 일</text>
<rect x="64" y="372" width="196" height="106" rx="12" fill="#e6eef9"/>
<text x="162" y="434" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">지우면</text>
<rect x="64" y="486" width="196" height="106" rx="12" fill="#e6eef9"/>
<text x="162" y="548" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">잘못 고치면</text>
<rect x="64" y="600" width="196" height="84" rx="12" fill="#e6eef9"/>
<text x="162" y="650" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">책임</text>

<!-- row 1: what it does -->
<g font-size="24" fill="#1f2a37" text-anchor="middle">
<rect x="268" y="280" width="310" height="84" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="423" y="330">파일을 보관</text>
<rect x="586" y="280" width="310" height="84" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="741" y="330">여러 곳을 같게 맞춤</text>
<rect x="904" y="280" width="310" height="84" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1059" y="330">따로 복사본을 둠</text>
<rect x="1222" y="280" width="310" height="84" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1377" y="330">이전 상태를 남김</text>

<!-- row 2: if deleted -->
<rect x="268" y="372" width="310" height="106" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="423" y="433">사라짐</text>
<rect x="586" y="372" width="310" height="106" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="3"/>
<text x="741" y="417">다른 곳에서도</text>
<text x="741" y="449">사라질 수 있음</text>
<rect x="904" y="372" width="310" height="106" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="3"/>
<text x="1059" y="433">백업본은 남음</text>
<rect x="1222" y="372" width="310" height="106" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1377" y="417">서비스 조건에 따라</text>
<text x="1377" y="449">복원 가능</text>

<!-- row 3: if edited by mistake -->
<rect x="268" y="486" width="310" height="106" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="423" y="547">그대로</text>
<rect x="586" y="486" width="310" height="106" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="3"/>
<text x="741" y="531">다른 곳도</text>
<text x="741" y="563">바뀔 수 있음</text>
<rect x="904" y="486" width="310" height="106" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="3"/>
<text x="1059" y="547">이전 복사본이 남음</text>
<rect x="1222" y="486" width="310" height="106" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1377" y="531">이전 버전으로</text>
<text x="1377" y="563">되돌릴 수 있는 경우</text>

<!-- row 4: responsibility -->
<rect x="268" y="600" width="310" height="84" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="423" y="650" font-weight="bold">나</text>
<rect x="586" y="600" width="310" height="84" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="741" y="650" font-weight="bold">서비스 설정</text>
<rect x="904" y="600" width="310" height="84" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="1059" y="650" font-weight="bold">나 (계획과 시험)</text>
<rect x="1222" y="600" width="310" height="84" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="1377" y="650" font-weight="bold">서비스 조건</text>
</g>

<!-- evidence and conclusion -->
<rect x="64" y="704" width="1000" height="146" rx="12" fill="#ffffff" stroke="#2f5d9b" stroke-width="2"/>
<text x="92" y="742" font-size="24" font-weight="bold" fill="#2f5d9b">공식 문서 확인 · 확인일 2026-10-26</text>
<text x="92" y="782" font-size="24" fill="#1f2a37">Drive for desktop: 수정이 컴퓨터와 Google Drive 양쪽에 자동 동기화 [S11]</text>
<text x="92" y="820" font-size="24" fill="#1f2a37">미러링·스트리밍 시: 휴지통에 넣은 파일은 모든 곳에서 휴지통으로 [S14]</text>
<line x1="1068" y1="777" x2="1110" y2="777" stroke="#2f5d9b" stroke-width="4" marker-end="url(#ah)"/>
<rect x="1120" y="704" width="416" height="146" rx="12" fill="#14253d"/>
<text x="1328" y="734" font-size="22" fill="#e6eef9" text-anchor="middle">저자 해석</text>
<text x="1328" y="770" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">동기화는 삭제도</text>
<text x="1328" y="802" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">함께 퍼뜨린다 →</text>
<text x="1328" y="836" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">동기화는 백업이 아니다</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
