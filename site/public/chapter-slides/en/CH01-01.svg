<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">What Is an AI Workspace?</title>
<desc id="d">A single AI service (a pencil) works only with the text, files and instructions you enter and the materials you provide, while this book's AI Workspace is the whole work environment of folders, cloud files, AI services, work documents and rules, and differs from the product term "workspace" used by services.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9b"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH01 · 1/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">What Is an AI Workspace?</text>
<text x="64" y="172" font-size="26" fill="#566273">Not a single AI service, but the whole work environment for working together with AI</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- Left: one AI service -->
<rect x="64" y="220" width="580" height="530" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<rect x="64" y="220" width="580" height="66" rx="12" fill="#2f5d9b"/>
<text x="354" y="264" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">One AI service = one pencil</text>
<rect x="92" y="306" width="524" height="56" rx="12" fill="#f1f5fb" stroke="#c9d4e5"/>
<text x="354" y="343" font-size="26" fill="#1f2a37" text-anchor="middle">Text, files and instructions you enter</text>
<line x1="354" y1="364" x2="354" y2="392" stroke="#2f5d9b" stroke-width="3" marker-end="url(#ah)"/>
<rect x="92" y="398" width="524" height="56" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="354" y="435" font-size="26" fill="#1f2a37" text-anchor="middle">Creates new text and returns it</text>
<text x="92" y="500" font-size="26" font-weight="bold" fill="#14253d">Materials AI uses</text>
<rect x="92" y="516" width="524" height="52" rx="12" fill="#f1f5fb" stroke="#c9d4e5"/>
<text x="354" y="551" font-size="24" fill="#1f2a37" text-anchor="middle">General knowledge (pre-training)</text>
<rect x="92" y="578" width="524" height="52" rx="12" fill="#f1f5fb" stroke="#c9d4e5"/>
<text x="354" y="613" font-size="24" fill="#1f2a37" text-anchor="middle">Work materials you provide</text>
<rect x="92" y="646" width="524" height="88" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
<text x="354" y="680" font-size="24" fill="#1f2a37" text-anchor="middle">Does not automatically read all</text>
<text x="354" y="714" font-size="24" fill="#1f2a37" text-anchor="middle">the work files on your computer</text>

<!-- Middle -->
<text x="672" y="500" font-size="52" font-weight="bold" fill="#2f5d9b" text-anchor="middle">≠</text>

<!-- Right: AI Workspace -->
<rect x="700" y="220" width="836" height="530" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<rect x="700" y="220" width="836" height="66" rx="12" fill="#14253d"/>
<text x="1118" y="264" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Workspace = the whole environment</text>
<text x="1118" y="340" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">A work environment for carrying out work with AI</text>

<rect x="728" y="376" width="246" height="96" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="851" y="416" font-size="26" fill="#1f2a37" text-anchor="middle">Folders on</text>
<text x="851" y="452" font-size="26" fill="#1f2a37" text-anchor="middle">your computer</text>
<rect x="995" y="376" width="246" height="96" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="1118" y="416" font-size="26" fill="#1f2a37" text-anchor="middle">Files kept</text>
<text x="1118" y="452" font-size="26" fill="#1f2a37" text-anchor="middle">in the cloud</text>
<rect x="1262" y="376" width="246" height="96" rx="12" fill="#2f5d9b"/>
<text x="1385" y="416" font-size="26" fill="#ffffff" text-anchor="middle">The AI services</text>
<text x="1385" y="452" font-size="26" fill="#ffffff" text-anchor="middle">you use</text>
<rect x="728" y="488" width="380" height="96" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="918" y="545" font-size="26" fill="#1f2a37" text-anchor="middle">Work documents</text>
<rect x="1128" y="488" width="380" height="96" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="1318" y="528" font-size="26" fill="#1f2a37" text-anchor="middle">Rules you follow when</text>
<text x="1318" y="564" font-size="26" fill="#1f2a37" text-anchor="middle">you ask AI to do work</text>

<rect x="728" y="600" width="780" height="134" rx="12" fill="#f1f5fb" stroke="#c9d4e5"/>
<text x="1118" y="630" font-size="22" fill="#566273" text-anchor="middle">Author's interpretation · desk analogy</text>
<text x="1118" y="666" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">Build not the pencil, but the desk, drawers, tidying rules</text>
<text x="1118" y="706" font-size="24" fill="#1f2a37" text-anchor="middle">Success: an environment to finish one real task with AI</text>

<!-- Bottom: service term -->
<rect x="64" y="764" width="1472" height="84" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="96" y="797" font-size="24" fill="#1f2a37"><tspan font-weight="bold" fill="#14253d">Not the "workspace" of services: </tspan>ChatGPT's personal / Managed workspaces are product terms set by that service</text>
<text x="96" y="832" font-size="24" fill="#1f2a37">This book's AI Workspace is a teaching concept (working definition) for your whole work environment</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
