<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">Chatbot, Workflow, Agent, Harness</title>
<desc id="d">Following this book's working definitions, it places the AI Chatbot, AI Workflow, AI Agent and AI Harness inside the AI Workspace as four different focuses, shows how they relate without forming one fixed hierarchy, and notes that agents can run with human approval points and a narrow permission boundary.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9b"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH01 · 3/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">How Do the Chatbot, Workflow, Agent and Harness Differ?</text>
<text x="64" y="172" font-size="24" fill="#566273">This book's working definitions (not industry standard) · vendors define agents differently · four different focuses</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- Outer: workspace -->
<rect x="64" y="214" width="1472" height="544" rx="12" fill="#e6eef9" stroke="#2f5d9b" stroke-width="2"/>
<text x="96" y="250" font-size="24" fill="#1f2a37"><tspan font-size="28" font-weight="bold" fill="#14253d">AI Workspace</tspan> — can embrace the environment, materials, tools and management system they work in</text>

<!-- Chatbot (top left) -->
<rect x="96" y="264" width="420" height="206" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="96" y="264" width="420" height="52" rx="12" fill="#5b7fb5"/>
<text x="306" y="302" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Chatbot</text>
<text x="120" y="348" font-size="24" fill="#1f2a37">Mainly converses with the user;</text>
<text x="120" y="378" font-size="24" fill="#1f2a37">responds to questions, requests</text>
<text x="120" y="416" font-size="24" font-weight="bold" fill="#2f5d9b">Q. When I ask something,</text>
<text x="120" y="446" font-size="24" font-weight="bold" fill="#2f5d9b">how does it answer?</text>

<!-- Hierarchy note (top gutter) -->
<rect x="532" y="274" width="288" height="188" rx="12" fill="#f1f5fb" stroke="#5b7fb5" stroke-width="2" stroke-dasharray="8 6"/>
<text x="676" y="308" font-size="24" font-weight="bold" fill="#14253d" text-anchor="middle">No fixed hierarchy</text>
<text x="676" y="340" font-size="24" fill="#1f2a37" text-anchor="middle">not “harness ⊃ agent</text>
<text x="676" y="370" font-size="24" fill="#1f2a37" text-anchor="middle">⊃ workflow”</text>
<text x="676" y="402" font-size="24" fill="#1f2a37" text-anchor="middle">connected or included,</text>
<text x="676" y="432" font-size="24" fill="#1f2a37" text-anchor="middle">by the aspect viewed</text>

<!-- Harness (top right) -->
<rect x="836" y="264" width="668" height="206" rx="12" fill="#ffffff" stroke="#14253d" stroke-width="2"/>
<rect x="836" y="264" width="668" height="52" rx="12" fill="#14253d"/>
<text x="1170" y="302" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Harness</text>
<text x="860" y="348" font-size="24" fill="#1f2a37">Supports and controls AI carrying out a task:</text>
<text x="860" y="378" font-size="24" fill="#1f2a37">rules, tools, permissions, state, verification/evaluation</text>
<text x="860" y="416" font-size="24" font-weight="bold" fill="#2f5d9b">Q. Within what rules and conditions does AI work,</text>
<text x="860" y="446" font-size="24" font-weight="bold" fill="#2f5d9b">how is it checked, what if it goes off track?</text>

<!-- Harness -> Agent -->
<line x1="1484" y1="474" x2="1484" y2="534" stroke="#14253d" stroke-width="3" marker-end="url(#ah)"/>
<text x="1464" y="498" font-size="24" fill="#14253d" text-anchor="end"><tspan font-weight="bold">can support and control an agent</tspan> — but is not the same as an agent</text>
<text x="1464" y="528" font-size="24" fill="#1f2a37" text-anchor="end">what an agent can do depends on its tools, permissions, verification structure</text>

<!-- Workflow (bottom left) -->
<rect x="96" y="540" width="420" height="206" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="96" y="540" width="420" height="52" rx="12" fill="#5b7fb5"/>
<text x="306" y="578" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Workflow</text>
<text x="120" y="624" font-size="24" fill="#1f2a37">The steps and processing flow</text>
<text x="120" y="654" font-size="24" fill="#1f2a37">for carrying out work</text>
<text x="120" y="692" font-size="24" font-weight="bold" fill="#2f5d9b">Q. In what order do we do it?</text>

<!-- Agent -> Workflow -->
<text x="676" y="584" font-size="24" fill="#14253d" text-anchor="middle">an agent can work as</text>
<text x="676" y="614" font-size="24" fill="#14253d" text-anchor="middle">one step of a workflow</text>
<line x1="830" y1="640" x2="522" y2="640" stroke="#2f5d9b" stroke-width="3" marker-end="url(#ah)"/>
<text x="676" y="672" font-size="24" fill="#1f2a37" text-anchor="middle">a workflow does not</text>
<text x="676" y="702" font-size="24" fill="#1f2a37" text-anchor="middle">always need an agent</text>

<!-- Agent (bottom right) -->
<rect x="836" y="540" width="668" height="206" rx="12" fill="#ffffff" stroke="#2f5d9b" stroke-width="2"/>
<rect x="836" y="540" width="668" height="52" rx="12" fill="#2f5d9b"/>
<text x="1170" y="578" font-size="24" fill="#ffffff" text-anchor="middle"><tspan font-size="28" font-weight="bold">AI Agent</tspan> — it acts (Tool Use): tools &amp; permissions are key</text>
<text x="860" y="624" font-size="24" fill="#1f2a37">Within a goal and an allowed permission boundary,</text>
<text x="860" y="654" font-size="24" fill="#1f2a37">assesses the situation, chooses actions, uses tools</text>
<text x="860" y="692" font-size="24" font-weight="bold" fill="#2f5d9b">Q. Given the goal and situation, what does it do,</text>
<text x="860" y="722" font-size="24" font-weight="bold" fill="#2f5d9b">with which tools and permissions?</text>

<!-- Caution band -->
<rect x="64" y="770" width="1472" height="80" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
<text x="92" y="802" font-size="24" font-weight="bold" fill="#b7791f">Not every agent is fully autonomous or runs without human supervision</text>
<text x="92" y="834" font-size="24" fill="#1f2a37">→ you can set human approval points (Human-in-the-loop) or a narrow permission boundary (Permission Boundary)</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
