<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">Workspace, Workflow, Harness</title>
<desc id="d">Following this book's working definitions, it separates the workspace (environment), the workflow (steps and procedure) and the harness (an execution system that supports and controls AI) by focus, and shows that they are not mutually exclusive because a harness can use the workflow's steps and the workspace's materials and tools.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9b"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH01 · 3/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">How Do the Workspace, Workflow and Harness Differ?</text>
<text x="64" y="172" font-size="26" fill="#566273">This book's working definitions (not industry standard) · different focuses on the same work</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- Outer: workspace -->
<rect x="64" y="220" width="1472" height="626" rx="12" fill="#e6eef9" stroke="#2f5d9b" stroke-width="2"/>
<text x="96" y="262" font-size="30" font-weight="bold" fill="#14253d">AI Workspace — the environment where work happens</text>
<text x="96" y="298" font-size="24" fill="#1f2a37">The whole environment organizing materials · AI tools · connections · access permissions · instructions · human roles</text>
<text x="96" y="332" font-size="24" font-weight="bold" fill="#2f5d9b">Q. Is what the work needs in place and organized?</text>

<!-- Workflow -->
<rect x="96" y="352" width="540" height="396" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="96" y="352" width="540" height="54" rx="12" fill="#5b7fb5"/>
<text x="366" y="389" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Workflow</text>
<text x="366" y="442" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">Steps and procedure of the work</text>
<text x="366" y="476" font-size="24" font-weight="bold" fill="#2f5d9b" text-anchor="middle">Q. In what order do you do it?</text>
<rect x="126" y="490" width="480" height="44" rx="12" fill="#f1f5fb" stroke="#c9d4e5"/>
<text x="146" y="520" font-size="24" fill="#1f2a37">1  Give the product description</text>
<rect x="126" y="538" width="480" height="44" rx="12" fill="#f1f5fb" stroke="#c9d4e5"/>
<text x="146" y="568" font-size="24" fill="#1f2a37">2  Receive a draft</text>
<rect x="126" y="586" width="480" height="44" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="2"/>
<text x="146" y="616" font-size="24" fill="#1f2a37">3  Check prices and schedule</text>
<rect x="126" y="634" width="480" height="44" rx="12" fill="#f1f5fb" stroke="#c9d4e5"/>
<text x="146" y="664" font-size="24" fill="#1f2a37">4  You decide and publish</text>
<text x="366" y="720" font-size="24" fill="#2f6f73" text-anchor="middle">With a verification step, still a workflow</text>

<!-- Relation arrow -->
<text x="728" y="510" font-size="24" fill="#14253d" text-anchor="middle">can include</text>
<text x="728" y="542" font-size="24" fill="#14253d" text-anchor="middle">or use steps</text>
<line x1="816" y1="572" x2="644" y2="572" stroke="#2f5d9b" stroke-width="3" marker-end="url(#ah)"/>

<!-- Harness -->
<rect x="820" y="352" width="684" height="396" rx="12" fill="#ffffff" stroke="#14253d" stroke-width="2"/>
<rect x="820" y="352" width="684" height="54" rx="12" fill="#14253d"/>
<text x="1162" y="389" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Harness</text>
<text x="1162" y="442" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">An execution system that supports and</text>
<text x="1162" y="476" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">controls AI to carry out a specific task</text>
<rect x="848" y="490" width="300" height="44" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="998" y="520" font-size="24" fill="#1f2a37" text-anchor="middle">Execution rules</text>
<rect x="1164" y="490" width="312" height="44" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="1320" y="520" font-size="24" fill="#1f2a37" text-anchor="middle">Tools</text>
<rect x="848" y="538" width="300" height="44" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="998" y="568" font-size="24" fill="#1f2a37" text-anchor="middle">Procedures</text>
<rect x="1164" y="538" width="312" height="44" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="1320" y="568" font-size="24" fill="#1f2a37" text-anchor="middle">Input/output conditions</text>
<rect x="848" y="586" width="300" height="44" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="998" y="616" font-size="24" fill="#1f2a37" text-anchor="middle">Verification criteria</text>
<rect x="1164" y="586" width="312" height="44" rx="12" fill="#e6eef9" stroke="#c9d4e5"/>
<text x="1320" y="616" font-size="24" fill="#1f2a37" text-anchor="middle">Exception handling</text>
<text x="1162" y="666" font-size="24" font-weight="bold" fill="#2f5d9b" text-anchor="middle">Q. Within what rules and conditions does AI work,</text>
<text x="1162" y="700" font-size="24" font-weight="bold" fill="#2f5d9b" text-anchor="middle">how is the result checked, and what happens</text>
<text x="1162" y="734" font-size="24" font-weight="bold" fill="#2f5d9b" text-anchor="middle">when it goes off track?</text>

<!-- Relation band -->
<rect x="96" y="758" width="1408" height="80" rx="12" fill="#ffffff" stroke="#c9d4e5"/>
<text x="800" y="790" font-size="24" fill="#1f2a37" text-anchor="middle"><tspan font-weight="bold" fill="#14253d">Not mutually exclusive categories</tspan> → tell them apart by which aspect the word describes</text>
<text x="800" y="824" font-size="24" fill="#1f2a37" text-anchor="middle">A harness can use the workspace's materials and tools; it is not just "a more systematic workflow"</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
