<text x="890" y="540" font-size="26" fill="#1f2a37">· Confirmed in official docs → source number</text>
<text x="890" y="578" font-size="26" fill="#1f2a37">· Tried myself → "exercise"</text>
<text x="890" y="616" font-size="26" fill="#1f2a37">· Not confirmed → "not checked"</text>

<rect x="860" y="666" width="676" height="180" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
