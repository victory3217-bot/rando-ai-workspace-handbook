<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">Plan scope and the ChatGPT-Claude comparison principle</title>
<desc id="d">On the left, the Project features added as the plan level rises and the settings this chapter fixes; on the right, comparing the two services under identical conditions and not judging which is better from a single comparison.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b7fb5"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH07 · 3/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">Plan scope and the ChatGPT · Claude comparison</text>
<text x="64" y="172" font-size="26" fill="#566273">Plan scope: official docs (S7, S8, S9) · this chapter's settings and comparison principle: the author's judgment</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- LEFT: plan tiers -->
<rect x="64" y="226" width="250" height="100" rx="12" fill="#5b7fb5"/>
