<text x="1403" y="401" font-size="24" fill="#566273" text-anchor="middle">Project</text>

<line x1="1198" y1="418" x2="1198" y2="452" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ah)"/>

<rect x="860" y="456" width="676" height="186" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
