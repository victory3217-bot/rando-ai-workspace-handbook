<rect x="324" y="226" width="496" height="100" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="350" y="268" font-size="26" fill="#1f2a37">Chat · Projects</text>
<text x="350" y="302" font-size="26" fill="#1f2a37">(up to 5 Projects on Free)</text>

<rect x="64" y="336" width="250" height="100" rx="12" fill="#2f5d9b"/>
<text x="189" y="378" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Paid plans</text>
<text x="189" y="412" font-size="24" fill="#ffffff" text-anchor="middle">Pro or higher</text>
<rect x="324" y="336" width="496" height="100" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="350" y="378" font-size="26" fill="#1f2a37">+ RAG expansion of knowledge</text>
<text x="350" y="412" font-size="26" fill="#1f2a37">+ Claude Code · Cowork</text>

<rect x="64" y="446" width="250" height="100" rx="12" fill="#14253d"/>
<text x="189" y="488" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Team and</text>
<text x="189" y="522" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Enterprise</text>
<rect x="324" y="446" width="496" height="100" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="350" y="488" font-size="26" fill="#1f2a37">+ Project sharing</text>
<text x="350" y="522" font-size="26" fill="#1f2a37">(Can view · Can edit)</text>

<rect x="64" y="566" width="756" height="280" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="2"/>
<text x="92" y="608" font-size="28" font-weight="bold" fill="#2f6f73">This chapter's settings (author's judgment)</text>
<text x="92" y="648" font-size="26" fill="#1f2a37">· Web is enough (no install) · Desktop optional</text>
<text x="92" y="684" font-size="26" fill="#1f2a37">· What is possible on Free · fictional data only</text>
<text x="92" y="720" font-size="26" fill="#1f2a37">· Not turned on: sharing, external connections,</text>
<text x="112" y="754" font-size="26" fill="#1f2a37">Cowork, folder access</text>
<text x="92" y="790" font-size="26" fill="#1f2a37">· Not in the name, description or instructions:</text>
<text x="112" y="824" font-size="26" fill="#1f2a37">personal info, passwords, API keys</text>

<!-- RIGHT: comparison logic -->
<rect x="860" y="226" width="360" height="190" rx="12" fill="#e6eef9" stroke="#5b7fb5" stroke-width="2"/>
<text x="1040" y="268" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">Keep identical</text>
<text x="884" y="310" font-size="25" fill="#1f2a37">· same fictional notes</text>
<text x="884" y="350" font-size="25" fill="#1f2a37">· same instructions</text>
<text x="884" y="390" font-size="25" fill="#1f2a37">· same verification criteria</text>

