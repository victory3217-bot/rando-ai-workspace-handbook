<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">AI Workflow and three ways of handing work over</title>
<desc id="d">Shows this book's working definition of an AI Workflow as a work procedure (order) plus five elements, and compares handing the same task over as human-led AI use, a pre-designed AI Workflow and an Agentic Workflow: who decides the next step and what the AI and the person each do. The three are not maturity stages; you choose by the task.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH11 · 1/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">AI Workflow and three ways of handing work over</text>
<text x="64" y="172" font-size="26" fill="#566273">Working definition, then three ways for one task</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- left: AI Workflow definition -->
<rect x="64" y="212" width="380" height="56" rx="12" fill="#14253d"/>
<text x="84" y="250" font-size="30" font-weight="bold" fill="#ffffff">AI Workflow</text>
<rect x="64" y="276" width="380" height="52" rx="12" fill="#f1f5fb" stroke="#5b7fb5" stroke-width="2"/>
<text x="254" y="311" font-size="24" font-weight="bold" fill="#14253d" text-anchor="middle">Work procedure = the order</text>
<rect x="64" y="336" width="380" height="208" rx="12" fill="#e6eef9"/>
<text x="84" y="374" font-size="24" fill="#1f2a37"><tspan font-weight="bold" fill="#2f5d9b">+</tspan> who (person or AI)</text>
<text x="84" y="412" font-size="24" fill="#1f2a37"><tspan font-weight="bold" fill="#2f5d9b">+</tspan> what comes in</text>
<text x="84" y="450" font-size="24" fill="#1f2a37"><tspan font-weight="bold" fill="#2f5d9b">+</tspan> what goes out</text>
<text x="84" y="488" font-size="24" fill="#1f2a37"><tspan font-weight="bold" fill="#2f5d9b">+</tspan> how it is checked</text>
<text x="84" y="526" font-size="24" fill="#1f2a37"><tspan font-weight="bold" fill="#2f5d9b">+</tspan> what if it fails</text>
<rect x="64" y="554" width="380" height="147" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="84" y="588" font-size="24" font-weight="bold" fill="#14253d">CH10 instructions</text>
<text x="84" y="620" font-size="24" fill="#1f2a37">= rules the AI follows</text>
<text x="84" y="656" font-size="24" font-weight="bold" fill="#14253d">CH11 Workflow</text>
<text x="84" y="688" font-size="24" fill="#1f2a37">= those rules in the flow</text>

<!-- right: three ways matrix -->
<rect x="662" y="212" width="286" height="70" rx="12" fill="#2f5d9b"/>
<text x="805" y="242" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Way 1</text>
<text x="805" y="273" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Human-led AI use</text>
<rect x="956" y="212" width="286" height="70" rx="12" fill="#2f5d9b"/>
<text x="1099" y="242" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Way 2</text>
<text x="1099" y="273" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Pre-designed Workflow</text>
<rect x="1250" y="212" width="286" height="70" rx="12" fill="#2f5d9b"/>
<text x="1393" y="242" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Way 3 (concept only)</text>
<text x="1393" y="273" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Agentic Workflow</text>

<!-- row 1: who decides -->
<rect x="464" y="288" width="190" height="101" rx="12" fill="#e6eef9"/>
<text x="478" y="331" font-size="24" font-weight="bold" fill="#14253d">Who decides</text>
<text x="478" y="363" font-size="24" font-weight="bold" fill="#14253d">the next step</text>
<rect x="662" y="288" width="286" height="101" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="676" y="318" font-size="24" fill="#1f2a37">A person,</text>
<text x="676" y="349" font-size="24" fill="#1f2a37">as it comes</text>
<rect x="956" y="288" width="286" height="101" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="970" y="318" font-size="24" fill="#1f2a37">Steps and branch</text>
<text x="970" y="349" font-size="24" fill="#1f2a37">conditions set early</text>
<rect x="1250" y="288" width="286" height="101" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1264" y="318" font-size="24" font-weight="bold" fill="#14253d">The AI Agent,</text>
<text x="1264" y="349" font-size="24" fill="#1f2a37">within goal, tools,</text>
<text x="1264" y="380" font-size="24" fill="#1f2a37">permissions, limits</text>

<!-- row 2: AI does -->
<rect x="464" y="395" width="190" height="70" rx="12" fill="#e6eef9"/>
<text x="478" y="439" font-size="24" font-weight="bold" fill="#14253d">The AI does</text>
<rect x="662" y="395" width="286" height="70" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="676" y="425" font-size="24" fill="#1f2a37">Requested work</text>
<text x="676" y="456" font-size="24" fill="#1f2a37">(write, summarize…)</text>
<rect x="956" y="395" width="286" height="70" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="970" y="425" font-size="24" fill="#1f2a37">Analyze, generate,</text>
<text x="970" y="456" font-size="24" fill="#1f2a37">classify in some steps</text>
<rect x="1250" y="395" width="286" height="70" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1264" y="425" font-size="24" fill="#1f2a37">Picks next action and</text>
<text x="1264" y="456" font-size="24" fill="#1f2a37">tool use by situation</text>

<!-- row 3: person does -->
<rect x="464" y="471" width="190" height="132" rx="12" fill="#e6eef9"/>
<text x="478" y="531" font-size="24" font-weight="bold" fill="#14253d">The person</text>
<text x="478" y="563" font-size="24" font-weight="bold" fill="#14253d">does</text>
<rect x="662" y="471" width="286" height="132" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="676" y="501" font-size="24" fill="#1f2a37">Sets steps, asks,</text>
<text x="676" y="532" font-size="24" fill="#1f2a37">verifies the result</text>
<rect x="956" y="471" width="286" height="132" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="970" y="501" font-size="24" fill="#1f2a37">Designs the flow,</text>
<text x="970" y="532" font-size="24" fill="#1f2a37">checks at approvals</text>
<rect x="1250" y="471" width="286" height="132" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1264" y="501" font-size="24" fill="#1f2a37">Sets goal, tools,</text>
<text x="1264" y="532" font-size="24" fill="#1f2a37">Permission Boundary;</text>
<text x="1264" y="563" font-size="24" fill="#1f2a37">approves, verifies,</text>
<text x="1264" y="594" font-size="24" fill="#1f2a37">is responsible</text>

<!-- row 4: predictability -->
<rect x="464" y="609" width="190" height="42" rx="12" fill="#e6eef9"/>
<text x="478" y="640" font-size="24" font-weight="bold" fill="#14253d">Predictable?</text>
<rect x="662" y="609" width="286" height="42" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="676" y="640" font-size="24" fill="#1f2a37">Depends on person</text>
<rect x="956" y="609" width="286" height="42" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="970" y="640" font-size="24" fill="#1f2a37">High (fixed path)</text>
<rect x="1250" y="609" width="286" height="42" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1264" y="640" font-size="24" fill="#1f2a37">May be lower</text>

<!-- human approval note -->
<rect x="464" y="657" width="1072" height="44" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="3"/>
<text x="482" y="688" font-size="24" fill="#1f2a37"><tspan font-weight="bold" fill="#b7791f">Human-in-the-loop</tspan>  Way 3 too: edit files, share, send outside, delete = human approval</text>

<!-- bottom strip -->
<rect x="64" y="712" width="976" height="138" rx="12" fill="#e6eef9"/>
<text x="88" y="764" font-size="28" font-weight="bold" fill="#14253d">Not maturity stages: the later way is not always better</text>
<text x="88" y="814" font-size="24" fill="#1f2a37">Choose by risk, repetition, rule clarity, cost, verifiability</text>
<rect x="1056" y="712" width="480" height="138" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1076" y="756" font-size="24" font-weight="bold" fill="#14253d">Author's view, not a standard</text>
<text x="1076" y="792" font-size="22" fill="#566273">Workspace, Workflow, harness,</text>
<text x="1076" y="824" font-size="22" fill="#566273">agent: not exclusive categories</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
