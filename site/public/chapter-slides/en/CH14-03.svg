<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">Run types and the level labeling rule</title>
<desc id="d">Shows the decision logic: if even one pre-run security check answer is no, a simulated run replaces the live run; the three run-type labels are never swapped; a run on fictional material alone is not Level 3; and the rule for labeling the level reached.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#566273"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH14 · 3/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">Run types and the level labeling rule</text>
<text x="64" y="172" font-size="26" fill="#566273">Pre-run check → run type label → the level you may write (Sections 2-4, 2-7, 2-9)</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- left: pre-run security check -->
<rect x="64" y="214" width="476" height="632" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="88" y="256" font-size="28" font-weight="bold" fill="#14253d">Pre-run security check</text>
<text x="88" y="290" font-size="24" fill="#566273">Done before you run the work (2-4)</text>
<text x="88" y="336" font-size="24" fill="#1f2a37">□ Input material is tier A or</text>
<text x="118" y="366" font-size="24" fill="#1f2a37">masked tier B</text>
<text x="88" y="410" font-size="24" fill="#1f2a37">□ The organization allows the</text>
<text x="118" y="440" font-size="24" fill="#1f2a37">AI service and account</text>
<text x="88" y="484" font-size="24" fill="#1f2a37">□ No personal information,</text>
<text x="118" y="514" font-size="24" fill="#1f2a37">password, or API key</text>
<text x="88" y="558" font-size="24" fill="#1f2a37">□ Project not shared, no external</text>
<text x="118" y="588" font-size="24" fill="#1f2a37">connections turned on</text>
<rect x="84" y="606" width="436" height="104" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="3"/>
<text x="106" y="644" font-size="26" font-weight="bold" fill="#b7791f">Even one "no"</text>
<text x="106" y="680" font-size="24" fill="#1f2a37">No live AI run; do a simulated run</text>
<rect x="84" y="726" width="436" height="104" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="3"/>
<text x="106" y="764" font-size="26" font-weight="bold" fill="#2f6f73">All "yes"</text>
<text x="106" y="800" font-size="24" fill="#1f2a37">A live AI service run is possible</text>

<path d="M520,658 H552 V342 H574" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#ah)"/>
<path d="M520,778 H566 V454 H574" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#ah)"/>
<path d="M566,566 H574" fill="none" stroke="#566273" stroke-width="3" marker-end="url(#ah)"/>

<!-- right: run type labels -->
<text x="580" y="262" font-size="28" font-weight="bold" fill="#14253d">Run type labels — never swap these three</text>
<rect x="580" y="290" width="320" height="104" rx="12" fill="#14253d"/>
<text x="740" y="352" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">[Simulated run]</text>
<rect x="912" y="290" width="368" height="104" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="932" y="326" font-size="24" fill="#1f2a37">Fictional material; no</text>
<text x="932" y="356" font-size="24" fill="#1f2a37">request to AI, or a</text>
<text x="932" y="386" font-size="24" fill="#1f2a37">fictional AI output used</text>

<rect x="580" y="402" width="320" height="104" rx="12" fill="#2f5d9b"/>
<text x="740" y="448" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">[Live AI run:</text>
<text x="740" y="478" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">fictional data]</text>
<rect x="912" y="402" width="368" height="104" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="932" y="448" font-size="24" fill="#1f2a37">Request sent to an AI</text>
<text x="932" y="478" font-size="24" fill="#1f2a37">service with fictional data</text>

<rect x="580" y="514" width="320" height="104" rx="12" fill="#2f5d9b"/>
<text x="740" y="560" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">[Live AI run:</text>
<text x="740" y="590" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">approved work data]</text>
<rect x="912" y="514" width="368" height="104" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="932" y="550" font-size="24" fill="#1f2a37">Real work material that</text>
<text x="932" y="580" font-size="24" fill="#1f2a37">the organization allows,</text>
<text x="932" y="610" font-size="24" fill="#1f2a37">tier check passed</text>

<rect x="1292" y="290" width="244" height="216" rx="12" fill="#ffffff" stroke="#a33a3a" stroke-width="3"/>
<text x="1414" y="364" font-size="24" fill="#1f2a37" text-anchor="middle">A run on fictional</text>
<text x="1414" y="398" font-size="24" fill="#1f2a37" text-anchor="middle">material alone is</text>
<text x="1414" y="434" font-size="26" font-weight="bold" fill="#a33a3a" text-anchor="middle">not Level 3</text>
<rect x="1292" y="514" width="244" height="104" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="3"/>
<text x="1414" y="558" font-size="24" fill="#1f2a37" text-anchor="middle">The run</text>
<text x="1414" y="590" font-size="24" font-weight="bold" fill="#2f6f73" text-anchor="middle">Level 3 requires</text>

<!-- labeling rule -->
<rect x="580" y="638" width="956" height="208" rx="12" fill="#e6eef9"/>
<text x="604" y="676" font-size="28" font-weight="bold" fill="#14253d">Labeling rule</text>
<text x="604" y="714" font-size="24" fill="#1f2a37">· Write only the highest level reached, with its evidence documents</text>
<text x="604" y="748" font-size="24" fill="#1f2a37">· Never mark a person who completed Level 1 as having completed Level 3</text>
<text x="604" y="782" font-size="24" fill="#1f2a37">· If even one condition of a level is missing, do not write that you reached it;</text>
<text x="624" y="814" font-size="24" fill="#1f2a37">write "working toward the next level" instead</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
