<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">Four Types of Material</title>
<desc id="d">Groups source material with summary and evidence material with work rule, shows each type's meaning, example and caution and how they relate, and states why they are kept separate.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9b"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH08 · 2/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">Four Types of Material</text>
<text x="64" y="172" font-size="26" fill="#566273">Keep source material, summaries, work rules, and evidence material apart</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- LEFT: source -> summary -->
<rect x="64" y="224" width="700" height="210" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="64" y="224" width="700" height="56" rx="12" fill="#14253d"/>
<text x="88" y="262" font-size="28" font-weight="bold" fill="#ffffff">Source material — exactly as received</text>
<text x="88" y="324" font-size="26" fill="#1f2a37">Example: meeting notes, a PDF of past minutes</text>
<text x="88" y="362" font-size="26" fill="#566273">Caution: do not edit it</text>
<text x="197" y="398" font-size="26" fill="#566273">check its tier (CH03)</text>

<line x1="120" y1="440" x2="120" y2="514" stroke="#2f5d9b" stroke-width="4" marker-end="url(#ar)"/>
<text x="150" y="470" font-size="26" font-weight="bold" fill="#2f5d9b">made by shortening the original</text>
<text x="150" y="506" font-size="24" fill="#b7791f">a summary can differ from the original</text>

<rect x="64" y="522" width="700" height="210" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="64" y="522" width="700" height="56" rx="12" fill="#2f5d9b"/>
<text x="88" y="560" font-size="28" font-weight="bold" fill="#ffffff">Summary — the original, shortened</text>
<text x="88" y="622" font-size="26" fill="#1f2a37">Example: summary of the past 3 months' decisions</text>
<text x="88" y="660" font-size="26" fill="#566273">Caution: note which original it came from</text>
<text x="197" y="696" font-size="26" fill="#566273">mark it if AI made the summary</text>

<!-- RIGHT: evidence -> rule -->
<rect x="836" y="224" width="700" height="210" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="836" y="224" width="700" height="56" rx="12" fill="#14253d"/>
<text x="860" y="262" font-size="28" font-weight="bold" fill="#ffffff">Evidence material — the reason for the rule</text>
<text x="860" y="324" font-size="26" fill="#1f2a37">Example: company document-writing guidelines,</text>
<text x="977" y="360" font-size="26" fill="#1f2a37">an email with the manager's instruction</text>
<text x="860" y="398" font-size="26" fill="#566273">Caution: record source and date</text>

<line x1="892" y1="440" x2="892" y2="514" stroke="#2f5d9b" stroke-width="4" marker-end="url(#ar)"/>
<text x="922" y="470" font-size="26" font-weight="bold" fill="#2f5d9b">shows why the rule is the way it is</text>
<text x="922" y="506" font-size="24" fill="#b7791f">a rule without evidence loses its reason to be followed</text>

<rect x="836" y="522" width="700" height="210" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="836" y="522" width="700" height="56" rx="12" fill="#2f5d9b"/>
<text x="860" y="560" font-size="28" font-weight="bold" fill="#ffffff">Work rule — an agreement we made</text>
<text x="860" y="622" font-size="26" fill="#1f2a37">Example: “If there is no owner or deadline,</text>
<text x="977" y="658" font-size="26" fill="#1f2a37">write ‘Needs confirmation’”</text>
<text x="860" y="696" font-size="26" fill="#566273">Caution: who decided it, when, any evidence?</text>

<!-- why -->
<rect x="64" y="756" width="1472" height="76" rx="12" fill="#e6eef9" stroke="#5b7fb5" stroke-width="2"/>
<text x="88" y="802" font-size="24" fill="#1f2a37"><tspan font-weight="bold" fill="#14253d">Why separate them · </tspan>AI can tell whether something is “an original, something someone shortened, or an agreement”</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
