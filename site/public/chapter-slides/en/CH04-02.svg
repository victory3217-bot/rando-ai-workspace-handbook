<title id="t">CH04 Designing a task-based work folder structure</title>
<desc id="d">Shows the four principles of folder design and the standard folder tree for candidate A, explains which boxes of the CH02 workspace map folders 01 to 03 and 04 connect to, and notes that folder 09 is a visible separator, not a security control.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="700" fill="#2f5d9b">CH04 · 2/3</text>
<text x="64" y="128" font-size="46" font-weight="700" fill="#14253d">Designing a task-based folder structure</text>
<text x="64" y="172" font-size="26" fill="#566273">Principles and standard structure: the author's suggestion · candidate A example</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- principles -->
<rect x="64" y="220" width="356" height="80" rx="12" fill="#2f5d9b"/>
<text x="242" y="252" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">① By task</text>
<text x="242" y="286" font-size="24" fill="#ffffff" text-anchor="middle">Divide folders by task</text>
<rect x="436" y="220" width="356" height="80" rx="12" fill="#2f5d9b"/>
<text x="614" y="252" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">② Depth</text>
<text x="614" y="286" font-size="24" fill="#ffffff" text-anchor="middle">About three levels</text>
<rect x="808" y="220" width="356" height="80" rx="12" fill="#2f5d9b"/>
<text x="986" y="252" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">③ Numbers</text>
<text x="986" y="286" font-size="24" fill="#ffffff" text-anchor="middle">Number prefixes fix order</text>
<rect x="1180" y="220" width="356" height="80" rx="12" fill="#2f5d9b"/>
<text x="1358" y="252" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">④ Same structure</text>
<text x="1358" y="286" font-size="24" fill="#ffffff" text-anchor="middle">The same for every task</text>

