<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">CH04 Files, folders, extensions, paths, and file formats</title>
<desc id="d">Shows a path as folders nested inside one another to explain files, folders, and paths, notes that the file extension decides which program opens a file, and compares the TXT, Markdown, Word, PDF, Excel, and CSV formats and their uses.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="700" fill="#2f5d9b">CH04 · 1/3</text>
<text x="64" y="128" font-size="46" font-weight="700" fill="#14253d">Files, folders, extensions, paths, formats</text>
<text x="64" y="172" font-size="26" fill="#566273">AI Workspace foundation: knowing where your material is</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- Left: path as nested folders -->
<text x="64" y="240" font-size="28" font-weight="700" fill="#14253d">Path = the address of a file</text>
<rect x="64" y="250" width="600" height="76" rx="12" fill="#ffffff" stroke="#2f5d9b" stroke-width="2"/>
<text x="84" y="280" font-size="24" fill="#1f2a37">Documents\AI_Work\</text>
<text x="84" y="313" font-size="24" fill="#1f2a37">10_TaskA_MeetingMinutes\03_Final</text>

<rect x="64" y="334" width="600" height="336" rx="12" fill="#e6eef9" stroke="#c9d4e5" stroke-width="2"/>
<text x="84" y="370" font-size="26" font-weight="700" fill="#14253d">Documents</text>
<text x="644" y="370" font-size="24" fill="#566273" text-anchor="end">Folder = a box for files</text>
<rect x="88" y="388" width="552" height="272" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="108" y="424" font-size="26" font-weight="700" fill="#14253d">AI_Work</text>
<text x="620" y="424" font-size="24" fill="#566273" text-anchor="end">Folders inside folders</text>
<rect x="112" y="442" width="504" height="208" rx="12" fill="#e6eef9" stroke="#c9d4e5" stroke-width="2"/>
<text x="132" y="478" font-size="26" font-weight="700" fill="#14253d">10_TaskA_MeetingMinutes</text>
<rect x="136" y="496" width="456" height="144" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="156" y="532" font-size="26" font-weight="700" fill="#14253d">03_Final</text>
<rect x="160" y="544" width="408" height="92" rx="12" fill="#ffffff" stroke="#2f5d9b" stroke-width="2"/>
<text x="364" y="582" font-size="28" font-weight="700" fill="#14253d" text-anchor="middle">report<tspan fill="#2f5d9b">.docx</tspan></text>
<text x="364" y="620" font-size="24" fill="#566273" text-anchor="middle">File = one item of saved material</text>

<rect x="64" y="686" width="600" height="160" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
<text x="84" y="722" font-size="26" font-weight="700" fill="#14253d">File extension (.docx, .pdf)</text>
<text x="84" y="758" font-size="24" fill="#1f2a37">Decides which program opens it</text>
<text x="84" y="792" font-size="24" fill="#1f2a37">Renaming only .docx → .pdf: won't open</text>
<text x="84" y="826" font-size="24" font-weight="700" fill="#2f6f73">→ Always keep extensions turned on</text>

<!-- Right: format matrix grouped -->
<text x="688" y="240" font-size="28" font-weight="700" fill="#14253d">Comparing file formats</text>

<!-- group 1 top 254 -->
<rect x="688" y="254" width="220" height="180" rx="12" fill="#14253d"/>
<text x="708" y="302" font-size="26" font-weight="700" fill="#ffffff">Unformatted</text>
<text x="708" y="338" font-size="24" fill="#ffffff">→ instructions</text>
<text x="708" y="370" font-size="24" fill="#ffffff">and templates</text>
<text x="708" y="402" font-size="24" fill="#ffffff">for AI</text>
<rect x="912" y="254" width="310" height="180" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="932" y="290" font-size="26" font-weight="700" fill="#14253d">TXT <tspan font-size="24" font-weight="400" fill="#566273">.txt</tspan></text>
<text x="932" y="324" font-size="24" fill="#1f2a37">Plain text, no styling</text>
<text x="932" y="356" font-size="24" fill="#1f2a37">Opens in Notepad</text>
<text x="932" y="388" font-size="24" fill="#2f5d9b">→ memos, rule notes,</text>
<text x="932" y="420" font-size="24" fill="#2f5d9b">text to paste</text>
<rect x="1226" y="254" width="310" height="180" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1246" y="290" font-size="26" font-weight="700" fill="#14253d">Markdown <tspan font-size="24" font-weight="400" fill="#566273">.md</tspan></text>
<text x="1246" y="324" font-size="24" fill="#1f2a37">Structure in symbols:</text>
<text x="1246" y="356" font-size="24" fill="#1f2a37"># headings, - lists</text>
<text x="1246" y="388" font-size="24" fill="#2f5d9b">→ instructions and</text>
<text x="1246" y="420" font-size="24" fill="#2f5d9b">templates for AI</text>

<!-- group 2 top 440 -->
<rect x="688" y="440" width="220" height="180" rx="12" fill="#14253d"/>
<text x="708" y="504" font-size="26" font-weight="700" fill="#ffffff">Word, PDF</text>
<text x="708" y="544" font-size="24" fill="#ffffff">→ outputs and</text>
<text x="708" y="576" font-size="24" fill="#ffffff">submissions</text>
<rect x="912" y="440" width="310" height="180" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="932" y="476" font-size="26" font-weight="700" fill="#14253d">Word <tspan font-size="24" font-weight="400" fill="#566273">.docx</tspan></text>
<text x="932" y="510" font-size="24" fill="#1f2a37">Formatted with fonts,</text>
<text x="932" y="542" font-size="24" fill="#1f2a37">tables, pictures</text>
<text x="932" y="574" font-size="24" fill="#2f5d9b">→ reports, minutes,</text>
<text x="932" y="606" font-size="24" fill="#2f5d9b">notices</text>
<rect x="1226" y="440" width="310" height="180" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1246" y="476" font-size="26" font-weight="700" fill="#14253d">PDF <tspan font-size="24" font-weight="400" fill="#566273">.pdf</tspan></text>
<text x="1246" y="510" font-size="24" fill="#1f2a37">Fixed appearance,</text>
<text x="1246" y="542" font-size="24" fill="#1f2a37">usually for reading</text>
<text x="1246" y="574" font-size="24" fill="#2f5d9b">→ final versions to</text>
<text x="1246" y="606" font-size="24" fill="#2f5d9b">submit or share</text>

<!-- group 3 top 626 -->
<rect x="688" y="626" width="220" height="180" rx="12" fill="#2f5d9b"/>
<text x="708" y="706" font-size="26" font-weight="700" fill="#ffffff">Tables</text>
<text x="708" y="742" font-size="24" fill="#ffffff">Excel, CSV</text>
<rect x="912" y="626" width="310" height="180" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="932" y="662" font-size="26" font-weight="700" fill="#14253d">Excel <tspan font-size="24" font-weight="400" fill="#566273">.xlsx</tspan></text>
<text x="932" y="696" font-size="24" fill="#1f2a37">Calculations and</text>
<text x="932" y="728" font-size="24" fill="#1f2a37">table formatting</text>
<text x="932" y="760" font-size="24" fill="#2f5d9b">→ lists, totals,</text>
<text x="932" y="792" font-size="24" fill="#2f5d9b">calculations</text>
<rect x="1226" y="626" width="310" height="180" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1246" y="662" font-size="26" font-weight="700" fill="#14253d">CSV <tspan font-size="24" font-weight="400" fill="#566273">.csv</tspan></text>
<text x="1246" y="696" font-size="24" fill="#1f2a37">Simple table; commas</text>
<text x="1246" y="728" font-size="24" fill="#1f2a37">split the columns</text>
<text x="1246" y="760" font-size="24" fill="#2f5d9b">→ exchanging tables</text>
<text x="1246" y="792" font-size="24" fill="#2f5d9b">without formatting</text>

<text x="688" y="838" font-size="22" fill="#566273">Grouping: author's interpretation · per-service formats: CH06, CH07</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
