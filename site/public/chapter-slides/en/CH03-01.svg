<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">Three separate questions about your input</title>
<desc id="d">Shows that what you enter into an AI service is first transmitted to the service company, and that retention and training use are separate questions to check. It contrasts common misunderstandings with the fact that transmission happens even without training use or retention.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b7fb5"/></marker>
</defs>
<text x="64" y="70" font-size="22" font-weight="700" fill="#2f5d9b">CH03 · 1/3</text>
<text x="64" y="128" font-size="46" font-weight="700" fill="#14253d">Three separate questions about your input</text>
<text x="64" y="172" font-size="26" fill="#566273">Transmission, retention, and training use are checked one by one</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- input -->
<rect x="64" y="300" width="240" height="125" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="184" y="352" font-size="30" font-weight="700" fill="#14253d" text-anchor="middle">My input</text>
<text x="184" y="394" font-size="26" fill="#566273" text-anchor="middle">text · files</text>
<line x1="304" y1="362" x2="360" y2="362" stroke="#5b7fb5" stroke-width="4" marker-end="url(#ar)"/>

<!-- transmission -->
<rect x="364" y="225" width="440" height="275" rx="12" fill="#14253d"/>
<text x="584" y="286" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">① Is it transmitted?</text>
<text x="584" y="346" font-size="26" fill="#ffffff" text-anchor="middle">Does my input arrive at</text>
<text x="584" y="382" font-size="26" fill="#ffffff" text-anchor="middle">the service company?</text>
<text x="584" y="440" font-size="24" fill="#e6eef9" text-anchor="middle">An AI service that runs on a</text>
<text x="584" y="474" font-size="24" fill="#e6eef9" text-anchor="middle">server generally does this</text>

<!-- branches -->
<path d="M804 300 H834 V290 H860" fill="none" stroke="#5b7fb5" stroke-width="4" marker-end="url(#ar)"/>
<path d="M804 425 H834 V435 H860" fill="none" stroke="#5b7fb5" stroke-width="4" marker-end="url(#ar)"/>

<rect x="864" y="225" width="672" height="130" rx="12" fill="#e6eef9" stroke="#5b7fb5" stroke-width="2"/>
<text x="892" y="267" font-size="30" font-weight="700" fill="#14253d">② Is it retained?</text>
<text x="892" y="305" font-size="26" fill="#1f2a37">How long do records (e.g. chat history) remain?</text>
<text x="892" y="340" font-size="24" fill="#566273">Differs by service, account type, and settings</text>

<rect x="864" y="370" width="672" height="130" rx="12" fill="#e6eef9" stroke="#5b7fb5" stroke-width="2"/>
<text x="892" y="412" font-size="30" font-weight="700" fill="#14253d">③ Is it used for training?</text>
<text x="892" y="450" font-size="26" fill="#1f2a37">Can the company use it to improve its model?</text>
<text x="892" y="485" font-size="24" fill="#566273">Differs by service, account type, and settings</text>

<!-- case strip -->
<rect x="64" y="520" width="1472" height="52" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="88" y="555" font-size="24" fill="#1f2a37"><tspan font-weight="700" fill="#2f5d9b">Case (sec. 3)</tspan> · A client discovery harness document says not only “we do not store it” but also “it is still transmitted”</text>

<!-- misconception vs fact -->
<rect x="64" y="595" width="680" height="250" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="92" y="642" font-size="28" font-weight="700" fill="#a33a3a">Common misunderstandings (author)</text>
<text x="92" y="692" font-size="26" fill="#1f2a37"><tspan fill="#a33a3a" font-weight="700">✗ </tspan>“They said they don't use it for</text>
<text x="122" y="726" font-size="26" fill="#1f2a37">training, so it's safe”</text>
<text x="92" y="782" font-size="26" fill="#1f2a37"><tspan fill="#a33a3a" font-weight="700">✗ </tspan>“They said it isn't saved, so</text>
<text x="122" y="816" font-size="26" fill="#1f2a37">it's fine to send”</text>

<line x1="744" y1="720" x2="800" y2="720" stroke="#5b7fb5" stroke-width="4" marker-end="url(#ar)"/>

<rect x="804" y="595" width="732" height="250" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="3"/>
<text x="832" y="642" font-size="28" font-weight="700" fill="#2f6f73">In fact</text>
<text x="832" y="694" font-size="26" fill="#1f2a37">Even if not used for training or not retained,</text>
<text x="832" y="730" font-size="26" font-weight="700" fill="#14253d">transmission still happens</text>
<text x="832" y="784" font-size="26" fill="#1f2a37">→ Check all three separately,</text>
<text x="862" y="820" font-size="26" fill="#1f2a37">then decide what to enter</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
