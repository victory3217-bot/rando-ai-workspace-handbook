<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">How a Claude Project is built and how it works</title>
<desc id="d">Shows that inside a Project the instructions and knowledge apply to every conversation, conversations share only what is in Project knowledge, Claude cannot see the name and description, and memory is separated by Project.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b7fb5"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH07 · 1/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">How a Claude Project is built and works</text>
<text x="64" y="172" font-size="26" fill="#566273">Project: a self-contained workspace with its own chat history and knowledge (official docs S7, S8)</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- Project container -->
<rect x="64" y="226" width="1000" height="620" rx="12" fill="#f1f5fb" stroke="#5b7fb5" stroke-width="2"/>
<text x="96" y="266" font-size="28" font-weight="bold" fill="#14253d">Project</text>

<rect x="96" y="284" width="936" height="96" rx="12" fill="#14253d"/>
<text x="564" y="322" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Project instructions</text>
<text x="564" y="360" font-size="26" fill="#ffffff" text-anchor="middle">Directions to Claude that apply to every conversation</text>

<rect x="96" y="394" width="936" height="96" rx="12" fill="#2f5d9b"/>
<text x="564" y="432" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Project knowledge</text>
<text x="564" y="470" font-size="26" fill="#ffffff" text-anchor="middle">Uploaded material · used in every conversation in the Project</text>

<line x1="250" y1="490" x2="250" y2="528" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ah)"/>
<line x1="564" y1="490" x2="564" y2="528" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ah)"/>
<line x1="878" y1="490" x2="878" y2="528" stroke="#5b7fb5" stroke-width="3" marker-end="url(#ah)"/>

<rect x="96" y="532" width="308" height="150" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="250" y="576" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">Chat 1</text>
<text x="250" y="618" font-size="24" fill="#1f2a37" text-anchor="middle">Files uploaded here</text>
<text x="250" y="654" font-size="24" fill="#566273" text-anchor="middle">→ used only here</text>

<rect x="410" y="532" width="308" height="150" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="564" y="576" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">Chat 2</text>
<text x="564" y="618" font-size="24" fill="#1f2a37" text-anchor="middle">Files uploaded here</text>
<text x="564" y="654" font-size="24" fill="#566273" text-anchor="middle">→ used only here</text>

<rect x="724" y="532" width="308" height="150" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="878" y="576" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">Chat 3</text>
<text x="878" y="618" font-size="24" fill="#1f2a37" text-anchor="middle">Files uploaded here</text>
<text x="878" y="654" font-size="24" fill="#566273" text-anchor="middle">→ used only here</text>

<rect x="96" y="704" width="936" height="118" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
<text x="564" y="752" font-size="27" font-weight="bold" fill="#14253d" text-anchor="middle">Context is not shared between conversations</text>
<text x="564" y="794" font-size="26" fill="#1f2a37" text-anchor="middle">Only what you put in Project knowledge is shared</text>

<!-- Right column: name/description -->
<rect x="1096" y="226" width="440" height="262" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
<text x="1316" y="272" font-size="30" font-weight="bold" fill="#b7791f" text-anchor="middle">Claude cannot see</text>
<text x="1316" y="318" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">the Project name</text>
<text x="1316" y="356" font-size="28" font-weight="bold" fill="#14253d" text-anchor="middle">or description</text>
<text x="1316" y="408" font-size="26" fill="#1f2a37" text-anchor="middle">→ write purpose and rules</text>
<text x="1316" y="446" font-size="26" fill="#1f2a37" text-anchor="middle">in the instructions (author)</text>

<!-- Right column: memory -->
<rect x="1096" y="508" width="440" height="338" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1316" y="554" font-size="30" font-weight="bold" fill="#14253d" text-anchor="middle">Memory</text>
<text x="1124" y="600" font-size="26" fill="#2f6f73">✓ This Project's memory</text>
<text x="1124" y="640" font-size="26" fill="#2f6f73">✓ Your memory outside it</text>
<text x="1124" y="680" font-size="26" fill="#a33a3a">✗ Other Projects' memory</text>
<line x1="1124" y1="706" x2="1508" y2="706" stroke="#c9d4e5" stroke-width="2"/>
<text x="1124" y="748" font-size="26" fill="#1f2a37">To separate it completely:</text>
<text x="1124" y="788" font-size="26" fill="#1f2a37">under Memory, turn off</text>
<text x="1124" y="826" font-size="26" font-weight="bold" fill="#14253d">Use account memory</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
