<line x1="1420" y1="450" x2="1420" y2="466" stroke="#2f5d9b" stroke-width="3"/>

<!-- index panel -->
<rect x="690" y="226" width="846" height="224" rx="12" fill="#f1f5fb" stroke="#2f5d9b" stroke-width="2"/>
<rect x="690" y="226" width="846" height="48" rx="12" fill="#2f5d9b"/>
<text x="714" y="259" font-size="26" font-weight="bold" fill="#ffffff">00_Index.md · one line per document</text>
<text x="714" y="308" font-size="24" fill="#1f2a37">No. · Document name · What it is for · Type · Location · Tier ·</text>
<text x="714" y="340" font-size="24" fill="#1f2a37">Source no. · Update date · Status</text>
<rect x="714" y="356" width="798" height="80" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="736" y="390" font-size="24" fill="#1f2a37">K01 · Minutes Writing Rules · rule · <tspan font-weight="bold" fill="#2f5d9b">10_Work_Rules</tspan> · A</text>
<text x="736" y="422" font-size="24" fill="#1f2a37">Source 1 · 2026-10-26 · <tspan font-weight="bold" fill="#2f6f73">valid</tspan></text>

<!-- status panel -->
<rect x="690" y="466" width="846" height="178" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="714" y="508" font-size="26" font-weight="bold" fill="#14253d">Status</text>
<rect x="830" y="478" width="110" height="42" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="3"/>
<text x="885" y="508" font-size="24" font-weight="bold" fill="#2f6f73" text-anchor="middle">valid</text>
<rect x="956" y="478" width="190" height="42" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="3"/>
<text x="1051" y="508" font-size="24" font-weight="bold" fill="#b7791f" text-anchor="middle">needs review</text>
<rect x="1162" y="478" width="120" height="42" rx="12" fill="#f1f5fb" stroke="#566273" stroke-width="3"/>
<text x="1222" y="508" font-size="24" font-weight="bold" fill="#566273" text-anchor="middle">retired</text>
<text x="714" y="562" font-size="24" fill="#1f2a37">Conflict, or check-again date passed → needs review</text>
<text x="714" y="596" font-size="24" fill="#1f2a37">A person decides and records it (not left to AI)</text>
<text x="714" y="630" font-size="24" fill="#1f2a37">Rule changed → v02; old document retired in 90_Archive (not deleted)</text>

<!-- source log panel -->
<rect x="690" y="658" width="846" height="182" rx="12" fill="#f1f5fb" stroke="#2f5d9b" stroke-width="2"/>
<rect x="690" y="658" width="846" height="48" rx="12" fill="#2f5d9b"/>
<text x="714" y="691" font-size="26" font-weight="bold" fill="#ffffff">90_Source_Log.md · all sources in one table</text>
<text x="714" y="740" font-size="24" fill="#1f2a37">Document · Source · Date of source · Date I checked ·</text>
<text x="714" y="772" font-size="24" fill="#1f2a37">Checked by · When to check again</text>
<text x="714" y="816" font-size="24" fill="#a33a3a">No source → mark it ‘no source’; do not use it as a rule</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
