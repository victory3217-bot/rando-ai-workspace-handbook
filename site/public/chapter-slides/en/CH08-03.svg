<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">How the Knowledge Folder Connects</title>
<desc id="d">Shows the subfolders of the candidate A knowledge folder, how the index records each document's location and status while the source log collects sources and check dates, and the rules for changing status.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9b"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH08 · 3/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">How the Knowledge Folder Connects</text>
<text x="64" y="172" font-size="26" fill="#566273">The index points to where each document is; the source log collects sources and dates</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- folder tree -->
<rect x="64" y="226" width="556" height="84" rx="12" fill="#14253d"/>
