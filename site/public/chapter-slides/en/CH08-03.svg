<text x="88" y="296" font-size="24" fill="#ffffff">inside 04_AI_Instructions_and_Templates</text>
<path d="M97,310 V704 M97,360 H130 M97,446 H130 M97,532 H130 M97,618 H130 M97,704 H130" stroke="#5b7fb5" stroke-width="3" fill="none"/>

<rect x="130" y="322" width="490" height="76" rx="12" fill="#e6eef9" stroke="#2f5d9b" stroke-width="3"/>
<text x="152" y="354" font-size="26" font-weight="bold" fill="#14253d">00_Index.md</text>
<text x="152" y="386" font-size="24" fill="#566273">list of documents</text>
<rect x="130" y="408" width="490" height="76" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="152" y="440" font-size="26" font-weight="bold" fill="#14253d">10_Work_Rules/</text>
<text x="152" y="472" font-size="24" fill="#566273">rule documents with source and date</text>
<rect x="130" y="494" width="490" height="76" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="152" y="526" font-size="26" font-weight="bold" fill="#14253d">20_Templates_and_Examples/</text>
<text x="152" y="558" font-size="24" fill="#566273">blank templates, fictional examples</text>
<rect x="130" y="580" width="490" height="76" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="152" y="612" font-size="26" font-weight="bold" fill="#14253d">30_Terms_and_Criteria/</text>
<text x="152" y="644" font-size="24" fill="#566273">terms, judgment criteria</text>
<rect x="130" y="666" width="490" height="76" rx="12" fill="#e6eef9" stroke="#2f5d9b" stroke-width="3"/>
<text x="152" y="698" font-size="26" font-weight="bold" fill="#14253d">90_Source_Log.md</text>
<text x="152" y="730" font-size="24" fill="#566273">sources, update dates, review cycle</text>

