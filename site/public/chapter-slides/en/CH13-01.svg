<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">Storage, sync, backup, version history</title>
<desc id="d">Compares storage, sync, backup and version history by what each does, what happens if you delete or edit by mistake, and who is responsible, and shows, with the official documentation evidence, why sync also spreads deletions and is therefore not backup.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><polygon points="0,0 10,5 0,10" fill="#2f5d9b"/></marker>
</defs>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH13 · 1/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">Storage · sync · backup · version history differ</text>
<text x="64" y="172" font-size="26" fill="#566273">All look like "keeping files", but deleting or editing by mistake ends differently</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- header row -->
<rect x="268" y="216" width="310" height="56" rx="12" fill="#14253d"/>
<text x="423" y="254" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Storage</text>
<rect x="586" y="216" width="310" height="56" rx="12" fill="#14253d"/>
<text x="741" y="254" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Sync</text>
<rect x="904" y="216" width="310" height="56" rx="12" fill="#14253d"/>
<text x="1059" y="254" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Backup</text>
<rect x="1222" y="216" width="310" height="56" rx="12" fill="#14253d"/>
<text x="1377" y="254" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Version history</text>

<!-- row labels -->
<rect x="64" y="280" width="196" height="84" rx="12" fill="#e6eef9"/>
<text x="162" y="314" font-size="24" font-weight="bold" fill="#14253d" text-anchor="middle">What it</text>
<text x="162" y="346" font-size="24" font-weight="bold" fill="#14253d" text-anchor="middle">does</text>
<rect x="64" y="372" width="196" height="106" rx="12" fill="#e6eef9"/>
<text x="162" y="417" font-size="24" font-weight="bold" fill="#14253d" text-anchor="middle">If you</text>
<text x="162" y="449" font-size="24" font-weight="bold" fill="#14253d" text-anchor="middle">delete</text>
<rect x="64" y="486" width="196" height="106" rx="12" fill="#e6eef9"/>
<text x="162" y="531" font-size="24" font-weight="bold" fill="#14253d" text-anchor="middle">If you edit</text>
<text x="162" y="563" font-size="24" font-weight="bold" fill="#14253d" text-anchor="middle">by mistake</text>
<rect x="64" y="600" width="196" height="84" rx="12" fill="#e6eef9"/>
<text x="162" y="634" font-size="24" font-weight="bold" fill="#14253d" text-anchor="middle">Who is</text>
<text x="162" y="666" font-size="24" font-weight="bold" fill="#14253d" text-anchor="middle">responsible</text>

<g font-size="24" fill="#1f2a37" text-anchor="middle">
<!-- row 1 -->
<rect x="268" y="280" width="310" height="84" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="423" y="330">Keeps the file</text>
<rect x="586" y="280" width="310" height="84" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="741" y="314">Makes several</text>
<text x="741" y="346">places match</text>
<rect x="904" y="280" width="310" height="84" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1059" y="314">Keeps a separate</text>
<text x="1059" y="346">copy</text>
<rect x="1222" y="280" width="310" height="84" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1377" y="330">Keeps earlier states</text>

<!-- row 2 -->
<rect x="268" y="372" width="310" height="106" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="423" y="433">It is gone</text>
<rect x="586" y="372" width="310" height="106" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="3"/>
<text x="741" y="417">May be gone from the</text>
<text x="741" y="449">other places too</text>
<rect x="904" y="372" width="310" height="106" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="3"/>
<text x="1059" y="433">The backup remains</text>
<rect x="1222" y="372" width="310" height="106" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1377" y="401">Can be restored,</text>
<text x="1377" y="433">depending on the</text>
<text x="1377" y="465">service's conditions</text>

<!-- row 3 -->
<rect x="268" y="486" width="310" height="106" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="423" y="547">Stays as is</text>
<rect x="586" y="486" width="310" height="106" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="3"/>
<text x="741" y="531">The other places</text>
<text x="741" y="563">may change too</text>
<rect x="904" y="486" width="310" height="106" rx="12" fill="#ffffff" stroke="#2f6f73" stroke-width="3"/>
<text x="1059" y="531">The earlier copy</text>
<text x="1059" y="563">remains</text>
<rect x="1222" y="486" width="310" height="106" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1377" y="515">You may be able</text>
<text x="1377" y="547">to go back to an</text>
<text x="1377" y="579">earlier version</text>

<!-- row 4 -->
<rect x="268" y="600" width="310" height="84" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="423" y="650" font-weight="bold">You</text>
<rect x="586" y="600" width="310" height="84" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="741" y="650" font-weight="bold">Service settings</text>
<rect x="904" y="600" width="310" height="84" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="1059" y="650" font-weight="bold">You (plan and tests)</text>
<rect x="1222" y="600" width="310" height="84" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="1377" y="634" font-weight="bold">The service's</text>
<text x="1377" y="666" font-weight="bold">conditions</text>
</g>

<!-- evidence and conclusion -->
<rect x="64" y="704" width="1000" height="146" rx="12" fill="#ffffff" stroke="#2f5d9b" stroke-width="2"/>
<text x="92" y="742" font-size="24" font-weight="bold" fill="#2f5d9b">Official documentation check · checked 2026-10-26</text>
<text x="92" y="782" font-size="24" fill="#1f2a37">Drive for desktop: edits sync automatically to both computer and Google Drive [S11]</text>
<text x="92" y="820" font-size="24" fill="#1f2a37">Mirrored or streamed: a file you put in the trash goes to the trash everywhere [S14]</text>
<line x1="1068" y1="777" x2="1110" y2="777" stroke="#2f5d9b" stroke-width="4" marker-end="url(#ah)"/>
<rect x="1120" y="704" width="416" height="146" rx="12" fill="#14253d"/>
<text x="1328" y="734" font-size="22" fill="#e6eef9" text-anchor="middle">Author's interpretation</text>
<text x="1328" y="770" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Sync also spreads</text>
<text x="1328" y="802" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">deletions →</text>
<text x="1328" y="836" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">sync is not backup</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
