<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">One workspace map: how the five boxes connect</title>
<desc id="d">A workspace map whose arrows show how material moves between the five components. ① and ② sync; ③ reads material from ① only after you paste or upload it; you save the result back to ① yourself; ③ takes reference material and rules from ④ and ⑤.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9b"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH02 · 2/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">One workspace map: how the five boxes connect</text>
<text x="64" y="172" font-size="26" fill="#566273">Arrows show the direction material moves</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- ① -->
<rect x="64" y="236" width="560" height="200" rx="12" fill="#14253d"/>
<text x="344" y="300" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">① PC·local files</text>
<text x="344" y="350" font-size="26" fill="#ffffff" text-anchor="middle">Starting point, where originals are</text>
<text x="344" y="392" font-size="26" fill="#ffffff" text-anchor="middle">Copies: inside the PC</text>

<!-- ② -->
<rect x="976" y="236" width="560" height="200" rx="12" fill="#2f5d9b"/>
<text x="1256" y="300" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">② Cloud storage</text>
<text x="1256" y="350" font-size="26" fill="#ffffff" text-anchor="middle">Backs up ① · shared across devices</text>
<text x="1256" y="392" font-size="26" fill="#ffffff" text-anchor="middle">Copies: server + synced devices</text>

<!-- sync arrow -->
<line x1="634" y1="336" x2="966" y2="336" stroke="#2f5d9b" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="800" y="318" font-size="28" font-weight="bold" fill="#2f5d9b" text-anchor="middle">sync</text>

<!-- ③ -->
<rect x="64" y="610" width="560" height="220" rx="12" fill="#2f5d9b"/>
<text x="344" y="668" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">③ AI work environment</text>
<text x="344" y="716" font-size="25" fill="#ffffff" text-anchor="middle">Reads only what you give it; drafts</text>
<text x="344" y="758" font-size="25" fill="#ffffff" text-anchor="middle">Copies: chat history and so on</text>
<text x="344" y="796" font-size="24" fill="#ffffff" text-anchor="middle">(differs by service, CH03)</text>

<!-- ① to ③ and back -->
<line x1="150" y1="446" x2="150" y2="600" stroke="#2f5d9b" stroke-width="4" marker-end="url(#ah)"/>
<text x="172" y="512" font-size="26" font-weight="bold" fill="#1f2a37">paste ·</text>
<text x="172" y="548" font-size="26" font-weight="bold" fill="#1f2a37">upload</text>
<line x1="560" y1="600" x2="560" y2="446" stroke="#2f5d9b" stroke-width="4" marker-end="url(#ah)"/>
<text x="582" y="494" font-size="26" font-weight="bold" fill="#1f2a37">copy the result and</text>
<text x="582" y="530" font-size="26" font-weight="bold" fill="#1f2a37">save it in ①</text>
<text x="582" y="566" font-size="26" font-weight="bold" fill="#1f2a37">yourself</text>

<!-- ④⑤ -->
<rect x="976" y="520" width="560" height="310" rx="12" fill="#e6eef9" stroke="#2f5d9b" stroke-width="2"/>
<text x="1256" y="562" font-size="24" fill="#566273" text-anchor="middle">Usually a set folder inside ① or ②</text>
<rect x="1000" y="584" width="512" height="110" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1256" y="628" font-size="30" font-weight="bold" fill="#14253d" text-anchor="middle">④ Knowledge base</text>
<text x="1256" y="670" font-size="26" fill="#1f2a37" text-anchor="middle">Useful work products and templates</text>
<rect x="1000" y="706" width="512" height="110" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1256" y="750" font-size="27" font-weight="bold" fill="#14253d" text-anchor="middle">⑤ Instructions·confirmation records</text>
<text x="1256" y="792" font-size="26" fill="#1f2a37" text-anchor="middle">Rules for ③ + record of what you checked</text>

<!-- ④⑤ to ③ -->
<line x1="966" y1="720" x2="634" y2="720" stroke="#2f5d9b" stroke-width="4" marker-end="url(#ah)"/>
<text x="800" y="664" font-size="26" font-weight="bold" fill="#2f5d9b" text-anchor="middle">reference</text>
<text x="800" y="700" font-size="26" font-weight="bold" fill="#2f5d9b" text-anchor="middle">material·rules</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
