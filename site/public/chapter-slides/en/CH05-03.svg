<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">Sharing and access permissions</title>
<desc id="d">Shows the Google Drive permission levels (only view, comment, edit) and sharing scopes (specific people, anyone with the link, Tier C material), the flow of recording a share and stopping it when the work is done, the limit of stopping, and how connecting an AI service widens what it can read.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9b"/></marker>
</defs>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH05 · 3/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">Sharing: only as much as needed, then stop</text>
<text x="64" y="172" font-size="26" fill="#566273">Sharing principles (author's suggestion): give only what is needed, record it, stop when done</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- panel A: permissions -->
<rect x="64" y="224" width="480" height="520" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="88" y="266" font-size="30" font-weight="bold" fill="#14253d">Permissions [S12]</text>
<text x="88" y="302" font-size="24" fill="#566273">edit · comment · only view</text>
<text x="88" y="352" font-size="24" fill="#1f2a37">Only who needs it, only as needed;</text>
<text x="88" y="386" font-size="24" fill="#1f2a37">start: view → comment → edit</text>
<text x="88" y="418" font-size="22" fill="#566273">(author's suggestion)</text>
<rect x="92" y="590" width="140" height="130" rx="12" fill="#2f6f73"/>
<text x="162" y="634" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">View</text>
<rect x="242" y="520" width="140" height="200" rx="12" fill="#5b7fb5"/>
<text x="312" y="564" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Comment</text>
<rect x="392" y="450" width="140" height="270" rx="12" fill="#2f5d9b"/>
<text x="462" y="494" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Edit</text>

<!-- panel B: scope -->
<rect x="568" y="224" width="480" height="520" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="592" y="266" font-size="30" font-weight="bold" fill="#14253d">Sharing scope</text>
<text x="592" y="302" font-size="24" fill="#566273">specific people or public [S12]</text>
<rect x="588" y="326" width="440" height="110" rx="12" fill="#f1f5fb" stroke="#2f6f73" stroke-width="3"/>
<text x="808" y="370" font-size="26" font-weight="bold" fill="#2f6f73" text-anchor="middle">Invite specific people</text>
<text x="808" y="408" font-size="24" fill="#1f2a37" text-anchor="middle">by name, only who needs it</text>
<rect x="588" y="452" width="440" height="140" rx="12" fill="#f1f5fb" stroke="#b7791f" stroke-width="3"/>
<text x="808" y="496" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">"Anyone with the link"</text>
<text x="808" y="534" font-size="24" fill="#1f2a37" text-anchor="middle">a last resort</text>
<text x="808" y="568" font-size="24" fill="#1f2a37" text-anchor="middle">if used, set a time limit</text>
<rect x="588" y="608" width="440" height="116" rx="12" fill="#f1f5fb" stroke="#a33a3a" stroke-width="3"/>
<text x="808" y="652" font-size="26" font-weight="bold" fill="#a33a3a" text-anchor="middle">Tier C material</text>
<text x="808" y="690" font-size="24" fill="#1f2a37" text-anchor="middle">do not share (CH03)</text>

<!-- panel C: ending -->
<rect x="1072" y="224" width="464" height="520" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="1096" y="266" font-size="30" font-weight="bold" fill="#14253d">Ending a share</text>
<text x="1096" y="302" font-size="24" fill="#566273">record it, stop when done</text>
<rect x="1092" y="326" width="424" height="96" rx="12" fill="#e6eef9" stroke="#2f5d9b" stroke-width="2"/>
<text x="1116" y="364" font-size="26" font-weight="bold" fill="#14253d">① Record</text>
<text x="1116" y="400" font-size="24" fill="#1f2a37">with whom · when · permission</text>
<line x1="1304" y1="424" x2="1304" y2="446" stroke="#2f5d9b" stroke-width="4" marker-end="url(#ah)"/>
<rect x="1092" y="450" width="424" height="130" rx="12" fill="#e6eef9" stroke="#2f5d9b" stroke-width="2"/>
<text x="1116" y="488" font-size="26" font-weight="bold" fill="#14253d">② Stop when done</text>
<text x="1116" y="524" font-size="24" fill="#1f2a37">'Remove' the permission</text>
<text x="1116" y="558" font-size="24" fill="#1f2a37">set link sharing to 'Restricted'</text>
<line x1="1304" y1="582" x2="1304" y2="604" stroke="#2f5d9b" stroke-width="4" marker-end="url(#ah)"/>
<rect x="1092" y="608" width="424" height="116" rx="12" fill="#e6eef9" stroke="#2f5d9b" stroke-width="2"/>
<text x="1116" y="648" font-size="26" font-weight="bold" fill="#14253d">③ Check</text>
<text x="1116" y="686" font-size="24" fill="#1f2a37">it does not open with their account</text>

<!-- bottom band -->
<rect x="64" y="762" width="700" height="86" rx="12" fill="#ffffff" stroke="#a33a3a" stroke-width="2"/>
<text x="88" y="796" font-size="24" font-weight="bold" fill="#a33a3a">Limit</text>
<text x="88" y="830" font-size="24" fill="#1f2a37">A copy already downloaded cannot be taken back</text>
<rect x="788" y="762" width="748" height="86" rx="12" fill="#ffffff" stroke="#2f5d9b" stroke-width="2"/>
<text x="812" y="796" font-size="24" fill="#1f2a37">Connecting cloud files to an AI service widens what it can read</text>
<text x="812" y="830" font-size="24" fill="#566273">Not turned on in this chapter (how it works: CH06, CH07)</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
<text x="1536" y="872" font-size="22" fill="#566273" text-anchor="end">[S12] official documentation checked 2026-10-26</text>
</svg>
