<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="en" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Arial,sans-serif">
<title id="t">One-time prompt vs work instructions</title>
<desc id="d">Compares a one-time prompt with reusable work instructions on five criteria (use, content, who knows it, how to fix it, verification) and shows the author's interpretation of what work instructions are worth.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="70" font-size="22" font-weight="bold" fill="#2f5d9b">CH10 · 1/3</text>
<text x="64" y="128" font-size="46" font-weight="bold" fill="#14253d">One-time prompt vs work instructions</text>
<text x="64" y="172" font-size="26" fill="#566273">From a request used once and forgotten to a document you reuse, revise and verify</text>
<rect x="64" y="196" width="1472" height="3" fill="#c9d4e5"/>

<!-- header row -->
<rect x="340" y="218" width="480" height="54" rx="12" fill="#e6eef9" stroke="#c9d4e5" stroke-width="2"/>
<text x="580" y="255" font-size="30" font-weight="bold" fill="#14253d" text-anchor="middle">One-time prompt</text>
<rect x="836" y="218" width="700" height="54" rx="12" fill="#2f5d9b"/>
<text x="1186" y="255" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Work instructions</text>

<!-- row 1 -->
<rect x="64" y="280" width="260" height="64" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="194" y="321" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">Use</text>
<rect x="340" y="280" width="480" height="64" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="580" y="321" font-size="26" fill="#566273" text-anchor="middle">Used once and forgotten</text>
<rect x="836" y="280" width="700" height="64" rx="12" fill="#e6eef9" stroke="#5b7fb5" stroke-width="2"/>
<text x="1186" y="321" font-size="26" fill="#1f2a37" text-anchor="middle">Used repeatedly</text>

<!-- row 2 -->
<rect x="64" y="352" width="260" height="116" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="194" y="419" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">Content</text>
<rect x="340" y="352" width="480" height="116" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="580" y="419" font-size="26" fill="#566273" text-anchor="middle">One line of request</text>
<rect x="836" y="352" width="700" height="116" rx="12" fill="#e6eef9" stroke="#5b7fb5" stroke-width="2"/>
<text x="1186" y="388" font-size="26" fill="#1f2a37" text-anchor="middle">Purpose, scope, input conditions,</text>
<text x="1186" y="420" font-size="26" fill="#1f2a37" text-anchor="middle">steps, format, prohibitions,</text>
<text x="1186" y="452" font-size="26" fill="#1f2a37" text-anchor="middle">exceptions, verification</text>

<!-- row 3 -->
<rect x="64" y="476" width="260" height="64" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="194" y="517" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">Who knows it</text>
<rect x="340" y="476" width="480" height="64" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="580" y="517" font-size="26" fill="#566273" text-anchor="middle">The person who wrote it</text>
<rect x="836" y="476" width="700" height="64" rx="12" fill="#e6eef9" stroke="#5b7fb5" stroke-width="2"/>
<text x="1186" y="517" font-size="26" fill="#1f2a37" text-anchor="middle">Me, coworkers, the AI service</text>

<!-- row 4 -->
<rect x="64" y="548" width="260" height="64" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="194" y="589" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">How to fix it</text>
<rect x="340" y="548" width="480" height="64" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="580" y="589" font-size="26" fill="#566273" text-anchor="middle">Case by case</text>
<rect x="836" y="548" width="700" height="64" rx="12" fill="#e6eef9" stroke="#5b7fb5" stroke-width="2"/>
<text x="1186" y="589" font-size="26" fill="#1f2a37" text-anchor="middle">Raise the version and record the reason</text>

<!-- row 5 -->
<rect x="64" y="620" width="260" height="64" rx="12" fill="#f1f5fb" stroke="#c9d4e5" stroke-width="2"/>
<text x="194" y="661" font-size="26" font-weight="bold" fill="#14253d" text-anchor="middle">Verification</text>
<rect x="340" y="620" width="480" height="64" rx="12" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
<text x="580" y="661" font-size="26" fill="#566273" text-anchor="middle">None</text>
<rect x="836" y="620" width="700" height="64" rx="12" fill="#e6eef9" stroke="#5b7fb5" stroke-width="2"/>
<text x="1186" y="661" font-size="26" fill="#1f2a37" text-anchor="middle">Has criteria and test records</text>

<!-- author's interpretation -->
<rect x="64" y="704" width="1472" height="132" rx="12" fill="#ffffff" stroke="#5b7fb5" stroke-width="2"/>
<rect x="88" y="744" width="300" height="52" rx="12" fill="#14253d"/>
<text x="238" y="778" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Author's interpretation</text>
<text x="412" y="745" font-size="26" fill="#1f2a37">Not magic that makes AI do well on its own — AI can still break them</text>
<text x="412" y="783" font-size="26" font-weight="bold" fill="#14253d">Value: expectations in writing, and a standard to notice and fix breaks</text>
<text x="412" y="818" font-size="22" fill="#566273">This book has not verified that writing work instructions improves results</text>

<text x="64" y="872" font-size="20" fill="#566273">Magis Global · AI Workspace Handbook</text>
</svg>
